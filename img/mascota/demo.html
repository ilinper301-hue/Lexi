<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lexi · mascota animada</title>
<style>body{margin:0;font:16px system-ui;display:grid}.p{padding:20px;display:grid;place-items:center}.c{background:#FDFBF2}.o{background:#0F1E16}
/* Lexi · mascota por capas (la imagen verde de Iván, 17-11-2026, sin redibujar) */
.lexi-mascota{position:relative;width:100%;max-width:520px;aspect-ratio:760/520;--lexi-cuerpo:#6AAF5E;--lexi-sombra:rgba(26,50,35,.14)}
.lexi-mascota>*,.lexi-mascota .flota>*{position:absolute}
.lexi-mascota img{left:0;top:0;width:100%;height:100%;display:block}
.lexi-mascota .sombra{background:var(--lexi-sombra);border-radius:50%;animation:lexi-sombra 4s ease-in-out infinite}
.lexi-mascota .flota{inset:0;animation:lexi-flota 4s ease-in-out infinite}
.lexi-mascota .brazo{transform-origin:16.4% 52.2%;animation:lexi-saluda 3.2s ease-in-out infinite}
.lexi-mascota .lid{background:var(--lexi-cuerpo);border-radius:50%;transform:scaleY(0);transform-origin:50% 0;animation:lexi-parpadea 5s infinite}
@keyframes lexi-flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}
@keyframes lexi-sombra{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.94)}}
@keyframes lexi-saluda{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(5deg)}}
@keyframes lexi-parpadea{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.lexi-mascota *{animation:none!important}}
</style></head><body>
<div class="p c"><div class="lexi-mascota">
<span class="sombra" style="left:25.71%;top:89.5%;width:52.5%;height:9.29%"></span>
<div class="flota"><img class="brazo" src="brazo.png" alt=""><img src="cuerpo.png" alt="Lexi, la mascota"><i class="lid" style="left:28.45%;top:27.13%;width:19.52%;height:28%;background:#64A75A"></i><i class="lid" style="left:55.83%;top:20.87%;width:19.88%;height:28.7%;background:#72B662"></i></div>
</div></div>
<div class="p o"><div class="lexi-mascota">
<span class="sombra" style="left:25.71%;top:89.5%;width:52.5%;height:9.29%"></span>
<div class="flota"><img class="brazo" src="brazo.png" alt=""><img src="cuerpo.png" alt="Lexi, la mascota"><i class="lid" style="left:28.45%;top:27.13%;width:19.52%;height:28%;background:#64A75A"></i><i class="lid" style="left:55.83%;top:20.87%;width:19.88%;height:28.7%;background:#72B662"></i></div>
</div></div>
</body></html>
