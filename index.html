<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexi: vocabulario</title>
<meta name="description" content="Palabras nuevas para la clase, con Lexi.">
<meta name="theme-color" content="#FDFBF2">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>@font-face{font-family:'Fredoka';src:url(fonts/fredoka.woff) format('woff');font-weight:400 700;font-display:swap}
@font-face{font-family:'Fredoka';src:url(fonts/fredoka-ext.woff) format('woff');font-weight:400 600;font-display:swap;unicode-range:U+0131,U+0152-0153,U+2122,U+2212}
@font-face{font-family:'Inter';src:url(fonts/inter-400.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-500.woff) format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-600.woff) format('woff');font-weight:600 700;font-display:swap}

/* ================= Colores: ÚNICO sitio (verdes de Lexi, diseño de Iván 17-11-2026) ================= */
:root{
  --bg:#FDFBF2;--card:#fff;--soft:#E1F1D7;--bd:#CFE5C6;--bd2:#B3D4A8;--tx:#113C2C;--mu:#3C6E55;
  --ac:#1D5637;--acx:#16472D;--acs:#D3EBC8;--aci:#1D5637;--on:#fff;--hero1:#1D5637;--hero2:#2E7A47;--onhero:#fff;
  --ok:#15803D;--okbg:#DCFCE7;--no:#DC2626;--nobg:#FEE2E2;
  --md:linear-gradient(135deg,#7C3AED,#14B8A6);
  --fd:'Fredoka',system-ui,sans-serif;--fi:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sh:0 1px 2px rgba(17,60,44,.05),0 4px 14px rgba(17,60,44,.07);
  --lexi-sombra:rgba(26,50,35,.14);
  --m0:#57A052;--m1:#67AD5A;--m2:#7AB968;--m3:#2A693B;--mbr:#438D49;--mojo:#113C2C;--mboca:#0F3B2C;--mlengua:#E8776A;
  --lx-hoja:#5FA757;--lx-prof:#1D5637;--lx-claro:#A9D69A;--lx-flor:#E8776A;--lx-tinta:#113C2C;--lx-blanco:#fff;
}
:root[data-theme="dark"]{
  --bg:#0F1E16;--card:#172A1F;--soft:#21382A;--bd:#2C4736;--bd2:#3D5F49;--tx:#E6F4E4;--mu:#A3C4AD;
  --ac:#8FCB80;--acx:#73B762;--acs:rgba(115,183,98,.22);--aci:#A9D69A;--on:#0F2A1D;--hero1:#8FCB80;--hero2:#A9D69A;--onhero:#0F2A1D;
  --ok:#4ADE80;--okbg:rgba(74,222,128,.15);--no:#F87171;--nobg:rgba(248,113,113,.15);
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  --lexi-sombra:rgba(0,0,0,.35);
  --lx-prof:#4E9E55;--lx-tinta:#A9D69A;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx)}
body{font-family:var(--fi);-webkit-text-size-adjust:100%}
.infantil{font-family:var(--fd)}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:72px 20px 28px}
.inicio,.pantalla{margin-block:auto}
.inicio{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.inicio h1{font:700 clamp(2.2rem,8vw,3.4rem)/1.1 var(--fd);margin:0}
.inicio p{margin:0;color:var(--mu);font-size:1.1rem}
.btn{min-height:56px;min-width:44px;padding:12px 28px;border:0;border-radius:18px;background:var(--ac);color:var(--on);font:600 1.3rem var(--fd);cursor:pointer;box-shadow:var(--sh)}
.btn:active{background:var(--acx)}
.btn.sec{background:var(--soft);color:var(--tx)}
.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.top .tema{pointer-events:auto}
.tema{min-width:44px;min-height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.3rem;cursor:pointer}
:focus-visible{outline:3px solid var(--aci);outline-offset:2px}

.escala{display:block;width:100%;height:auto}
.escala-fila{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;width:100%;max-width:520px}
.escala-fila{margin:10px auto 18px}
.escala-fila figure{margin:0;min-width:0;text-align:center}
.escala-fila figure .escala{max-width:120px;margin:0 auto}
.escala-fila figcaption{font:500 clamp(.8rem,2.6vw,1.1rem)/1.15 var(--fd);margin-top:6px;overflow-wrap:anywhere}

.opciones{display:grid;gap:12px;width:100%}
.btn.grande{width:100%;min-height:72px;font-size:1.6rem}
.pantalla{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;text-align:center}
.h-pant{font:700 clamp(1.8rem,6vw,2.6rem)/1.1 var(--fd);margin:0}
.h-sec{font:600 1.3rem var(--fd);margin:0}
.mu{color:var(--mu);margin:0}.pq{font-size:.95rem}
.quien{display:grid;gap:10px}
.qa{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border-radius:18px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:600 1.3rem var(--fd);text-align:left;cursor:pointer}
.qa.on{border-color:var(--aci)}
.av{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:1.6rem;flex:none}
.casa-cab{display:flex;align-items:center;justify-content:center;gap:12px}
.nuevo{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
.campo{width:100%;min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--bd2);background:var(--bg);color:var(--tx);font:500 1.2rem var(--fd)}
.animales{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.animales button{min-height:52px;border-radius:14px;border:0;font-size:1.8rem;cursor:pointer}
.animales button.on{outline:4px solid var(--tx);outline-offset:1px}
.error{color:var(--no);font:500 1rem var(--fi);margin:0;min-height:1.2em}

.dcha{display:flex;gap:8px;pointer-events:none}.dcha .tema{pointer-events:auto}
.pill-md{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:22px;background:var(--md);color:#fff;font:600 1.05rem var(--fd);border:0}
.pill-md.salir{cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:14px;font:500 1rem var(--fi);z-index:20;box-shadow:var(--sh)}
.tutor{font-family:var(--fi);text-align:left}
.h-t{font:600 1.7rem/1.2 var(--fi);margin:0}.h-s{font:600 1rem var(--fi);margin:8px 0 0;color:var(--mu)}
.lista{display:flex;flex-direction:column;gap:8px}
.fila-t{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:500 1rem var(--fi);text-align:left;cursor:pointer;position:relative}
.fila-t .tx2{flex:1;display:flex;flex-direction:column}.fila-t small{color:var(--mu);font-size:.85rem}
.fila-t input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tarjeta{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
.tutor .tarjeta p{margin:0}
.aviso{margin:0;padding:12px 14px;border-radius:12px;background:var(--nobg);color:var(--no)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.peligro{background:var(--no);color:#fff}.btn.peligro.sec{background:var(--nobg);color:var(--no)}
.btn.peligro{font-family:var(--fi);font-size:1.05rem}
.pinw{align-items:center;text-align:center}.pinw h2{margin:0;font:600 1.4rem var(--fi)}.pinw .lk{color:var(--aci)}
.pd{display:flex;gap:14px;justify-content:center;margin:6px 0}.pd i{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd2)}.pd i.f{background:var(--aci);border-color:var(--aci)}
.pd.mal{animation:sacude .35s}@keyframes sacude{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pk{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}.pk button{min-height:64px;border-radius:50%;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font:600 1.5rem var(--fi);cursor:pointer;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.pd.mal{animation:none}}
.tutor .btn{font-family:var(--fi);font-size:1.05rem}

/* ===== Palabras de la semana y presentación ===== */
.pantalla.ancha{max-width:1100px}
.palabras{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pal{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:18px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;text-align:left;box-shadow:var(--sh)}
.pal:active{border-color:var(--aci)}
.pal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--soft)}
.pal-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;padding:0 4px 2px}
.pal-n{font:600 clamp(1.3rem,4.5vw,1.8rem)/1.1 var(--fd);overflow-wrap:normal}
.pal .escala{width:44px;flex:none}
.pres{gap:18px}
.rotulo{margin:0;align-self:center;padding:6px 18px;border-radius:20px;background:var(--soft);color:var(--mu);font:600 1.05rem var(--fd)}
.cuerpo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:38vh}
.gr{margin:0;font:500 clamp(1.5rem,4vw,2.8rem)/1.3 var(--fd)}
.gr-p{font-size:1.2rem}
.nota-g{font:500 1rem var(--fi);color:var(--mu);margin:0;text-align:center}
.pal-ch{margin:0;font:700 clamp(1.3rem,3vw,2rem) var(--fd);color:var(--aci)}
.palabra-g{margin:0;font:700 clamp(3.5rem,16vw,9rem)/1 var(--fd);overflow-wrap:anywhere}
.silabas{margin:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.sil{display:inline-block;padding:.1em .4em;border-radius:.35em;background:var(--soft);font:700 clamp(2.4rem,11vw,6rem)/1.1 var(--fd)}
.pt{font:700 clamp(2rem,9vw,5rem) var(--fd);color:var(--ac);font-style:normal}
.escena{display:grid;gap:14px;width:100%;justify-items:center}
.esc-img{display:block;width:100%;max-width:720px;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:var(--soft);box-shadow:var(--sh)}
@media (min-width:760px) and (orientation:landscape){.escena{grid-template-columns:1.1fr 1fr;align-items:center;text-align:left}}
.fin-esc{display:flex;align-items:center;gap:10px;font:600 1.4rem var(--fd)}.fin-esc .escala{width:72px}
.pts{display:flex;justify-content:center;gap:8px}
.pts i{width:12px;height:12px;border-radius:50%;border:2px solid var(--bd2)}
.pts i.hecho{background:var(--acs);border-color:var(--acs)}.pts i.on{background:var(--ac);border-color:var(--ac);transform:scale(1.25)}
.nav{display:grid;grid-template-columns:minmax(128px,1fr) 2fr;gap:12px}.nav .btn{white-space:nowrap}
.nav .btn{min-height:68px;font-size:1.5rem}
.top .izq{display:flex;gap:8px;pointer-events:none}.top .izq .tema{pointer-events:auto}

/* ===== Jugamos ===== */
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.vals .btn{min-height:68px;padding:10px 6px;font-size:clamp(1.05rem,4vw,1.5rem)}
.veredicto{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 20px;border-radius:16px;font:500 clamp(1.2rem,3vw,1.8rem)/1.3 var(--fd);text-align:center}
.veredicto b{font-weight:700}.veredicto.si{background:var(--okbg);color:var(--ok)}.veredicto.no{background:var(--nobg);color:var(--no)}
.opcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:720px}
.opc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:3px solid var(--bd);background:var(--card);font:700 clamp(1.2rem,4.5vw,2rem) var(--fd);overflow-wrap:anywhere}
.opc i{font-style:normal;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--mu);font-size:1.4rem}
.opc.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}

/* Hoja para las familias (paso 5.2): en pantalla se ve como el papel; al imprimir solo sale la hoja, en blanco y negro */
.hoja{background:#fff;color:#000;border:1px solid var(--bd);border-radius:12px;padding:20px;font:400 1rem/1.35 var(--fi)}
.hoja h2{font:600 1.5rem var(--fi);margin:0 0 6px}.hoja h3{font:600 1.15rem var(--fi);margin:0}.hoja p{margin:2px 0}
.hoja-lista,.hoja ol{margin:10px 0;padding:0}.hoja-lista{list-style:none;display:grid;gap:8px}.hoja ol{padding-left:22px}
.hoja-pal{display:flex;gap:10px;align-items:flex-start;break-inside:avoid;border-bottom:1px solid #ccc;padding-bottom:6px}
.hoja-pal img{width:72px;height:54px;object-fit:cover;border-radius:6px;flex:none}
.hoja-ideas{margin-top:8px!important}
@media print{body{background:#fff!important}.top,.hoja-ctl,.toast,#toast{display:none!important}
.pantalla{padding:0!important;max-width:none!important}.hoja{border:0;padding:0;font-size:10.5pt}@page{size:A4;margin:14mm}}

/* Tarjetas para imprimir (paso 5.1): fondo blanco, sin colores del tema, legibles en blanco y negro */
.tj-hoja{background:#fff;color:#000;border:1px solid #bbb;border-radius:10px;margin:10px 0;padding:14px;font-family:var(--fi)}
.tj-g .tj-hoja{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.tj-g .tj-img img{max-width:100%;max-height:50vh;border-radius:10px}.tj-g h2{font:700 clamp(2.4rem,9vw,5rem) var(--fd);margin:0}.tj-g p{margin:0;font-size:.95rem;max-width:34em}
.tj-p .tj-hoja{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tj-p figure{margin:0;border:1px dashed #888;border-radius:8px;padding:8px;text-align:center}.tj-p figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.tj-p figcaption{font:700 1.3rem var(--fd);margin-top:4px}
@media print{.tj-hoja{border:0;border-radius:0;margin:0;padding:0;break-after:page}.tj-hoja:last-child{break-after:auto}
.tj-g{page:tgrande}.tj-p{page:tpeq}@page tgrande{size:A4 landscape;margin:10mm}@page tpeq{size:A4 portrait;margin:10mm}
.tj-g .tj-hoja{min-height:185mm;justify-content:center}.tj-g .tj-img img{max-height:105mm}.tj-g h2{font-size:64pt}.tj-g p{font-size:12pt}
.tj-p .tj-hoja{gap:6mm}.tj-p figure{border:1px dashed #000}.tj-p figcaption{font-size:20pt}}
/* «La hemos encontrado» (paso 5.5): chispa de la tarjeta del muro y botones con dibujo */
.pal{position:relative}
.chispa{position:absolute;top:14px;right:14px;display:inline-flex;align-items:center;gap:3px;padding:4px 10px 4px 6px;border-radius:999px;background:var(--card);color:var(--ac);border:2px solid var(--ac);font:700 1rem var(--fd);box-shadow:var(--sh)}
.enc-btn{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
/* Explorar (paso 5.7): parejas en grande */
.parejas{display:grid;gap:10px}.pareja-mini{align-items:center;text-align:center}.pareja-mini .pal-n{font:700 1.4rem var(--fd)}
.pareja{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pareja figure{margin:0;text-align:center}.pareja img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}.pareja .palabra-g{font-size:clamp(1.6rem,6vw,3rem)}
/* Cuenta de Google (52-cuenta.js): botón con el logo y enlace discreto del inicio */
.btn.ggl{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--fi);font-size:1.05rem;background:var(--soft);color:var(--tx)}
.btn.ggl:disabled,.btn:disabled{opacity:.6;cursor:default}
.enlace{min-height:44px;min-width:44px;padding:8px 14px;border:0;background:none;color:var(--mu);font:500 .95rem var(--fi);text-decoration:underline;cursor:pointer}
.tutor .tarjeta .casa-cab{justify-content:flex-start}

/* Paso 6.4 · pantalla «Juntar tus datos» (PV3) */
.lista-lado{margin:0;padding-left:20px;display:grid;gap:6px}

/* ===== Casa del perfil: mismo esquema que Calculi y Lectori (cabecera, saludo, tarjetas, zona del tutor) ===== */
#app[data-sc="casa"]{padding-top:calc(12px + env(safe-area-inset-top))}
.casa{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px;margin:0 auto auto}
.casa button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hd.casa-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:42px;height:42px;border-radius:12px;display:block}
.wm{font:600 clamp(1.5rem,6.4vw,1.8rem)/1 var(--fd);color:var(--ac)}
.hr{display:flex;gap:8px;align-items:center}
.rnd{width:48px;height:48px;border-radius:50%;border:2px solid var(--bd);background:var(--card);display:grid;place-items:center;padding:0}
.av-bt{border:0;background:none;padding:0;border-radius:50%;min-width:48px;min-height:48px;display:grid;place-items:center}
.av-bt .av{width:52px;height:52px;font-size:1.8rem;box-shadow:0 0 0 3px var(--bd)}
.greet{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 4px}
.greet .mas{flex:none}
.greet .hi{font:600 clamp(1.7rem,7vw,2.2rem)/1.1 var(--fd);margin:0}
.greet p{margin:4px 0 0;color:var(--mu);font-size:1.15rem}
.home-grid{display:flex;flex-direction:column;gap:12px}
.lc{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;text-align:left;padding:14px 16px;border-radius:26px;border:2px solid var(--bd);background:var(--card);box-shadow:var(--sh);transition:transform .08s}
.lc .ico{width:60px;height:60px;border-radius:18px;background:var(--acs);color:var(--aci);display:grid;place-items:center;flex:none}
.lc{text-wrap:balance;font-weight:500!important;font-size:1.45rem!important;line-height:1.15!important}
.lc.hero{min-height:112px;background:linear-gradient(135deg,var(--hero1),var(--hero2));border-color:transparent;color:var(--onhero)}
.lc.hero .ico{width:72px;height:72px;background:rgba(255,255,255,.16);color:var(--onhero)}
:root[data-theme="dark"] .lc.hero .ico{background:rgba(15,42,29,.12)}
.lc.hero{font-size:1.9rem!important;font-weight:600!important}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:12px}
.hc{display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;padding:12px;border-radius:22px;border:2px solid var(--bd);background:var(--card);box-shadow:var(--sh);font-size:1.2rem!important;text-align:center}
.hc svg{color:var(--aci);flex:none}
.crece{padding:4px 12px 0;border-radius:22px;background:var(--card);border:2px solid var(--bd)}
.crece .escala-fila{margin:6px auto 10px}
.tzb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:60px;padding:14px;border-radius:24px;border:2px dashed var(--bd2);background:none;color:var(--mu)!important;font-size:1.15rem!important}
.lc:active,.hc:active,.rnd:active,.tzb:active{transform:scale(.97)}
@media (min-width:700px){.home-grid{display:grid;grid-template-columns:1fr 1fr}.home-grid .lc.hero{grid-column:1/-1}}
@media (min-width:700px) and (min-height:900px) and (orientation:portrait){.casa{max-width:760px;gap:20px}.greet .hi{font-size:2.6rem}.greet p{font-size:1.35rem}.lc{font-size:1.6rem!important}.lc.hero{font-size:2.2rem!important}}
@media (orientation:landscape) and (min-width:820px){.casa{max-width:900px}.greet .hi{font-size:2.4rem}.greet p{font-size:1.25rem}}

/* Lexi · mascota en vectores (14-mascota.js), con el mismo movimiento que Calculi */
.lexi-mascota{width:100%;max-width:440px;display:grid;place-items:center}
.lexi-mascota .mas{width:100%;height:auto}
.mas{overflow:visible;color:var(--tx)}
.mas .cuerpo{animation:lexi-flota 3.4s ease-in-out infinite alternate;transform-origin:50% 90%;transform-box:fill-box}
.mas .sombra{animation:lexi-sombra 3.4s ease-in-out infinite alternate;transform-origin:50% 50%;transform-box:fill-box}
.mas .ojo{animation:lexi-parpadea 5.2s infinite;transform-origin:50% 50%;transform-box:fill-box}
.mas .brazo-i{animation:lexi-saluda 1.6s ease-in-out infinite alternate;transform-origin:42px 78px}
.mas.quieta *{animation:none!important}
@keyframes lexi-flota{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes lexi-sombra{from{transform:scaleX(1);opacity:.14}to{transform:scaleX(.85);opacity:.08}}
@keyframes lexi-parpadea{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
@keyframes lexi-saluda{from{transform:rotate(-6deg)}to{transform:rotate(12deg)}}
@media (prefers-reduced-motion:reduce){.mas *{animation:none!important}}

<body>
<div id="app"></div>
<script>/* ---- js/00-util.js ---- */
'use strict';
/* ===== Utilidades comunes ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Día = fecha LOCAL del dispositivo (AAAA-MM-DD), no la de UTC: a las 00:30 en Madrid ya es el día siguiente. `f` solo sirve para probar. */
const hoy = (f = new Date()) => f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
/* Almacén propio: todas las claves con prefijo «lexi.» (se comparte dominio con otras apps) */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('lexi.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lexi.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const nid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---- js/05-palabras.js ---- */
'use strict';
/* ===== Fichas de palabras: cada archivo de src/js/palabras/ llama a PALABRA({...}) ===== */
const PALABRAS = [];
const PALABRA = p => { PALABRAS.push(p); };
const palabraPorId = id => PALABRAS.find(p => p.id === id);

/* ---- js/10-tema.js ---- */
/* Tema claro/oscuro (clave lexi.th) */
const TEMA = {
  aplicar(t) { document.documentElement.dataset.theme = t; const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'dark' ? '#0F1E16' : '#FDFBF2'; },
  inicial() { const g = LS.get('th', null); return g || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); },
  alternar() { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; LS.set('th', t); this.aplicar(t); }
};

const ico = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICP[n] || ''}</svg>`;
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ---- js/14-mascota.js ---- */
/* ===== Mascota de Lexi: un bocadillo de palabras (diseño de Iván, 17-11-2026) =====
   Dibujada a mano en vectores con formas limpias (círculos y curvas suaves de pocos puntos),
   como las mascotas de Calculi, Lectori y Barri. Flota, parpadea y saluda con el brazo izquierdo;
   el brazo nace dentro del cuerpo, así que al girar nunca se abre un hueco.
   Colores en --m0…--mlengua (estilos.css). */
function mascota(tam = 240, quieta = false) {
  const cuerpo = 'M62 16C88 8 120 3 144 4C170 5 182 14 185 36C188 56 188 76 182 92C176 104 160 110 140 113C112 117 92 119 74 119C66 122 54 127 45 128.5C38 129.5 35.5 124 39 120C42 115 45 109 46 104C38 92 35 76 36 60C37 40 44 24 62 16Z';
  const boca = 'M96 80.5C107 81.5 119 79 128 74.5C131 73 132.4 75.5 131.8 79C130 91 121.5 98.5 112 98.5C102 98.5 95 90.5 94.5 84.5C94.2 82 94.8 80.4 96 80.5Z';
  const ojo = (cx, cy, r, px, py) => `<g class="ojo"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff"/>`
    + `<circle cx="${px}" cy="${py}" r="${(r * .63).toFixed(1)}" fill="var(--mojo)"/>`
    + `<circle cx="${px + 5.5}" cy="${py - 6.5}" r="${(r * .25).toFixed(1)}" fill="#fff"/></g>`;
  return `<svg class="mas${quieta ? ' quieta' : ''}" width="${tam}" height="${Math.round(tam * 148 / 216)}" viewBox="0 0 216 148" role="img" aria-label="Lexi, la mascota">
  <defs>
    <linearGradient id="lexi-g" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="120"><stop offset="0" style="stop-color:var(--m2)"/><stop offset="1" style="stop-color:var(--m0)"/></linearGradient>
    <clipPath id="lexi-d"><path d="M180 60C194 60 206 70 209 84C211 95 207 105 199 105C192 105 188 98 190 90C191 84 188 78 180 76Z"/></clipPath><clipPath id="lexi-i"><path d="M54 70C42 66 31 59 24 52C18 46 9 47 5 54C1 61 4 70 12 76C22 84 36 89 54 88Z"/></clipPath><clipPath id="lexi-c"><path d="${cuerpo}"/></clipPath><clipPath id="lexi-b"><path d="${boca}"/></clipPath>
  </defs>
  <ellipse class="sombra" cx="111" cy="138" rx="55" ry="6.5" fill="currentColor" opacity=".12"/>
  <g class="cuerpo">
    <path d="M180 60C194 60 206 70 209 84C211 95 207 105 199 105C192 105 188 98 190 90C191 84 188 78 180 76Z" fill="var(--mbr)"/>
    <path d="M182 57C190 62 193.5 77 189 92L176 92L176 57Z" fill="var(--m3)" opacity=".8" clip-path="url(#lexi-d)"/>
    <g class="brazo-i">
      <path d="M54 70C42 66 31 59 24 52C18 46 9 47 5 54C1 61 4 70 12 76C22 84 36 89 54 88Z" fill="var(--mbr)"/>
      <path d="M39 63C32 69 30.5 79 34 87.5L50 88L50 63Z" fill="var(--m3)" opacity=".8" clip-path="url(#lexi-i)"/>
    </g>
    <path d="${cuerpo}" fill="url(#lexi-g)"/>
    <g clip-path="url(#lexi-c)">
      <path d="M28 94C56 112 102 116 142 109C162 105.5 178 97 192 82L192 140L28 140Z" fill="var(--mbr)" opacity=".75"/>
    </g>
    <path d="M67.5 39Q72 31 80.5 32.5M135 21Q143 18.5 149 26.5" fill="none" stroke="var(--mojo)" stroke-width="3.8" stroke-linecap="round"/>
    ${ojo(82, 62, 20, 85.5, 61.5)}${ojo(140, 53.5, 20.5, 137.5, 53.5)}
    <path d="${boca}" fill="var(--mboca)"/>
    <ellipse cx="115" cy="96.5" rx="14.5" ry="9.5" fill="var(--mlengua)" clip-path="url(#lexi-b)"/>
  </g>
</svg>`;
}

/* ---- js/15-escala.js ---- */
/* Escala de 4 pasos de cada palabra: una planta que crece (decidido por Iván, 16-11-2026; antes, el bocadillo de Lexi).
   1 Nueva = semilla · 2 La conocemos = brote · 3 La entendemos = planta con hojas · 4 La usamos = planta con flor */
const PASOS = ['Nueva', 'La conocemos', 'La entendemos', 'La usamos'];
function hojaSVG(y, s, color, lado) {
  const L = 18 * s;
  return `<path transform="scale(${lado},1)" d="M0 ${y} Q${-L * .5} ${y - L * .8} ${-L} ${y - L * .3} Q${-L * .55} ${y + L * .3} 0 ${y} Z" fill="${color}"/>`;
}
function escalaSVG(paso) {
  const p = Math.max(1, Math.min(4, paso | 0)), k = [.85, .9, .95, 1][p - 1];
  const tallo = y => `<path d="M0 134 V${y}" stroke="var(--lx-prof)" stroke-width="4.5" stroke-linecap="round" fill="none"/>`;
  const par = (y, s, c) => hojaSVG(y, s, c, 1) + hojaSVG(y, s, c, -1);
  const suelo = `<path d="M-26 138 Q-20 130 0 130 Q20 130 26 138 Z" fill="var(--lx-prof)"/>`;
  const planta = [
    `<ellipse cx="0" cy="127" rx="6.5" ry="4.6" fill="var(--lx-tinta)" transform="rotate(-25 0 127)"/><circle cx="-2" cy="125.4" r="1.4" fill="var(--lx-blanco)"/>`,
    tallo(118) + par(118, .8, 'var(--lx-hoja)'),
    tallo(98) + par(120, 1.05, 'var(--lx-hoja)') + par(108, .9, 'var(--lx-claro)') + par(98, .6, 'var(--lx-hoja)'),
    tallo(92) + par(121, 1.15, 'var(--lx-hoja)') + par(110, 1, 'var(--lx-claro)') + par(100, .75, 'var(--lx-hoja)')
      + [0, 72, 144, 216, 288].map(a => `<circle cx="${(Math.sin(a * Math.PI / 180) * 7.5).toFixed(2)}" cy="${(84 - Math.cos(a * Math.PI / 180) * 7.5).toFixed(2)}" r="6" fill="var(--lx-flor)"/>`).join('')
      + `<circle cx="0" cy="84" r="4.4" fill="var(--lx-blanco)"/>`
  ][p - 1];
  return `<svg class="escala" viewBox="-42 62 84 84" role="img" aria-label="Paso ${p} de 4: ${PASOS[p - 1]}">`
    + `<g transform="translate(0,138) scale(${k}) translate(0,-138)">${suelo}${planta}</g></svg>`;
}
function escalaFila() {
  return '<div class="escala-fila">' + PASOS.map((n, i) => `<figure>${escalaSVG(i + 1)}<figcaption>${n}</figcaption></figure>`).join('') + '</div>';
}

/* ---- js/20-datos.js ---- */
/* ===== Datos guardados: una sola clave, «lexi.v1» (prefijo propio: se comparte dominio con otras apps) =====
   Perfil Docente = una CLASE ({t:'doc'}); perfil Familias = un NIÑO ({t:'fam', av}). El progreso va por perfil, no por alumno:
   perfil.pal = { idPalabra: { e: paso de la escala 1..4 (1 Nueva, 2 La conocemos, 3 La entendemos, 4 La usamos), pres: fecha en que se presentó } }.
   v1 → v2: se añade «pal» a cada perfil (vacío).
   v2 → v3: cada palabra puede llevar «val» = valoraciones del docente [{d: fecha, t: tarea, v: 'todos'|'mitad'|'pocos'}] (las últimas 30).
   v3 → v4: cada palabra lleva además la escala y las cajas de repaso (dA, dB, cam, mal, caja, prox, u, ut, ov; ver 30-escala-logica.js) y
   el perfil lleva «ses» (día de la última sesión «Hoy»); ajustes.nuevas = palabras nuevas por sesión (1 o 2). La migración repite las «val»
   guardadas en orden con las reglas de la escala, así que no se pierde ningún paso ni ninguna valoración.
   v4 → v5 (paso 6.1, nube): marcas de «última modificación» para poder fusionar dos dispositivos: EST.gmt (ajustes), EST.del {idPerfil: marca} (borrados),
   perfil.mt (el perfil) y perfil.pal[id].m (la palabra). Marca = milisegundos, siempre mayor que cualquier marca ya vista (reloj atrasado, FU5). Sin marca = 0.
   Las reglas (valorarPalabra, presentarRegistro…) viven en 30-escala-logica.js; la fusión, en 21-fusion.js; aquí solo se leen, se sanean y se guardan. */
const VERSION_DATOS = 5,
  TAREAS_ID = ['sentido', 'ejemplo', 'elige', 'gesto', 'acaba', 'habla', 'relaciona'] /* las que ya existen en pantalla */, MAX_PERFILES = 40;
/* Mismos 30 animalitos y mismo orden que Calculi y Lectori (un niño conserva su animal en todas las apps) */
const AVATARES = [['🦊','#FED7AA'],['🐢','#BBF7D0'],['🐼','#E2E8F0'],['🦁','#FDE68A'],['🐸','#D9F99D'],['🐙','#F5D0FE'],['🐳','#BAE6FD'],['🦉','#E7D3B5'],
  ['🐝','#FEF08A'],['🐞','#FECACA'],['🦄','#FBCFE8'],['🐨','#CBD5E1'],['🐶','#FDE2C4'],['🐱','#FFE4B5'],['🐰','#FCE7F3'],['🐻','#E8CBA8'],
  ['🐯','#FED7AA'],['🐷','#FBCFE8'],['🐮','#E5E7EB'],['🐵','#E7D3B5'],['🐧','#C7D2FE'],['🐤','#FEF3C7'],['🦋','#BFDBFE'],['🐬','#A5F3FC'],
  ['🦒','#FDE68A'],['🦓','#E5E7EB'],['🐘','#CBD5E1'],['🦔','#E7D3B5'],['🐿️','#FED7AA'],['🦜','#BBF7D0']];

const ss = (s, n) => String(s ?? '').replace(/[<>&"'`]/g, '').trim().slice(0, n);
const esFecha = d => fechaOK(d);
function estadoVacio() { return { v: VERSION_DATOS, modo: '', act: '', perfiles: [], ajustes: { pin: '', nuevas: 2, preg: true }, gmt: 0, del: {} }; }
/* Modo Docente: todo abierto y NO se guarda progreso (los ajustes sí, con guardarAjustes) */
let MODO_DOCENTE = false;
let EST = estadoVacio();

/** Valoraciones del docente: solo tarea y valor conocidos y fecha válida; se quedan las últimas MAX_VAL. */
/* ===== Marcas de modificación (FU5 de docs/nube.md) ===== */
const nm = x => { const n = Math.floor(Number(x)); return Number.isFinite(n) && n > 0 ? Math.min(n, 8.64e15) : 0; };
const MAX_DEL = 200;
let AHORA = () => Date.now(); /* la hora, aparte para poder probar relojes atrasados */
/** Borrados: { idPerfil: marca }, solo ids con forma válida y los 200 más recientes. */
function limpiarDel(o) {
  if (!o || typeof o !== 'object') return {};
  const l = Object.entries(o).filter(([k, v]) => /^[a-z0-9]{6,20}$/.test(k) && nm(v)).map(([k, v]) => [k, nm(v)]).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1)).slice(0, MAX_DEL);
  return Object.fromEntries(l);
}
/** La marca más alta que hay en un estado (ajustes, borrados, perfiles y palabras). */
function maxMarca(est) {
  let m = nm(est && est.gmt); for (const k in (est && est.del) || {}) m = Math.max(m, nm(est.del[k]));
  for (const p of (est && est.perfiles) || []) { m = Math.max(m, nm(p.mt)); for (const id in p.pal || {}) m = Math.max(m, nm(p.pal[id].m)); }
  return m;
}
/** FU5 · La marca de un cambio nuevo: la hora, o la más alta ya vista + 1 si el reloj va atrasado. Así un cambio hecho después de sincronizar siempre gana. */
const siguienteMarca = (est, ahora = AHORA()) => Math.max(nm(ahora), maxMarca(est) + 1);
/** Un solo sitio para marcar un cambio en un perfil (y, si hay id, en esa palabra). Renombrar o cambiar animal marcan solo el perfil. */
function tocar(p, id) { const m = siguienteMarca(EST); p.mt = m; if (id && p.pal && p.pal[id]) p.pal[id].m = m; return m; }
function marcarAjustes() { EST.gmt = siguienteMarca(EST); }
function limpiarVal(a) {
  return (Array.isArray(a) ? a : []).filter(x => x && typeof x === 'object' && esFecha(x.d) && TAREAS_VAL.includes(x.t) && VALORES.includes(x.v))
    .map(x => ({ d: x.d, t: x.t, v: x.v })).slice(-MAX_VAL);
}
const limpiarDias = a => [...new Set((Array.isArray(a) ? a : []).filter(esFecha))].slice(-MAX_DIAS_BUENOS);
/** Cuentas de tareas hechas: solo tareas conocidas y números enteros no negativos. */
function limpiarCuentas(o) {
  const r = {}; if (!o || typeof o !== 'object') return r;
  for (const t of TAREAS_VAL) { const n = Number(o[t]); if (Number.isFinite(n) && n > 0) r[t] = Math.min(Math.floor(n), 100000); }
  return r;
}
/** Registro de una palabra ya en v4: sanea cada campo sin tocar el paso (solo lo acota a 1-4) y arregla caja o fecha de vuelta rotas. */
function limpiarRegistro(v) {
  const r = palabraNueva();
  r.e = Math.max(1, Math.min(4, v.e | 0)); r.pres = esFecha(v.pres) ? v.pres : ''; r.val = limpiarVal(v.val);
  r.dA = limpiarDias(v.dA); r.dB = limpiarDias(v.dB); r.cam = esFecha(v.cam) ? v.cam : ''; r.mal = esFecha(v.mal) ? v.mal : '';
  const c = Number(v.caja); r.caja = Number.isFinite(c) ? Math.max(1, Math.min(5, Math.round(c))) : 1;
  r.prox = esFecha(v.prox) ? v.prox : '';
  const mm = nm(v.m); if (mm) r.m = mm; /* marca de la palabra (sin marca = 0) */
  r.u = limpiarCuentas(v.u); r.ut = TAREAS_VAL.includes(v.ut) ? v.ut : ''; r.ov = v.ov === true;
  if (encTotal(v)) r.enc = encDe(v); /* «La hemos encontrado» (EN7): solo si se ha apuntado alguna vez */
  if (r.e < 2) { r.caja = 1; r.prox = ''; r.dA = []; r.dB = []; }
  else if (!r.prox && !(r.e === 4 && r.caja === 5)) r.prox = sumarDias(esFecha(r.pres) ? r.pres : hoy(), 1); /* solo descansa la de «La usamos» en la caja 5 */
  return r;
}
/** Migración v1-v3 → v4: parte de «recién presentada» y repite las valoraciones guardadas, en orden, con las reglas de la escala. */
function migrarRegistro(v) {
  const val = limpiarVal(v.val), e = Math.max(1, Math.min(4, v.e | 0)), pres = esFecha(v.pres) ? v.pres : '';
  if (e < 2 || !pres) return limpiarRegistro({ e, pres, val });
  let r = presentarRegistro(palabraNueva(), pres);
  for (const x of val) r = valorarPalabra(r, x.t, x.v, x.d);
  r.val = val; /* el historial queda tal cual estaba, también lo anterior a la presentación */
  r.e = Math.max(r.e, e);
  return limpiarRegistro(r);
}
/** Progreso por palabra: solo ids con forma válida. `migrar`: los datos son de antes de la v4. */
function limpiarPal(o, migrar) {
  const r = {}; if (!o || typeof o !== 'object') return r;
  for (const [k, v] of Object.entries(o)) {
    if (!/^[a-z0-9-]{1,30}$/.test(k) || !v || typeof v !== 'object') continue;
    r[k] = migrar ? migrarRegistro(v) : limpiarRegistro(v);
    if (Object.keys(r).length >= 1000) break;
  }
  return r;
}
function limpiarPerfil(p, migrar) {

/* ---- js/21-fusion.js ---- */
/* ===== Fusión de dos dispositivos (reglas FU1-FU7 y VE2 de docs/nube.md): funciones PURAS, sin red y sin tocar `EST` =====
   Aquí solo se decide qué queda al juntar lo del dispositivo (`local`) con lo de la cuenta (`remoto`); quien sincroniza (paso 6.3) lee la nube, llama a
   `fusionarTodo` y escribe lo que ella diga. Las marcas (`mt`, `m`, `gmt`, `del`) y su reloj están en 20-datos.js.
   Forma de `remoto`: { aj, gmt, del, perfiles: [{ id, mt, v, d }] }; `d` = el perfil (texto JSON u objeto); si no se puede leer, el perfil se salta (FU6). */

    Nunca se mezcla campo a campo (paso, días buenos y repaso van juntos), salvo `enc`. */

}

    `ses` = el día más reciente; fecha de creación = la más antigua; `mt` = la mayor. */

/* ===== Escala (reglas E1-E11) y cajas de repaso (R1-R9): funciones PURAS, sin pantalla y sin reloj =====
   Todas reciben el día («AAAA-MM-DD», hora local) como dato y devuelven un registro nuevo; no tocan nada guardado.
   Registro de una palabra (datos v4, docs/pedagogia.md apartado 13):
   { e: paso 1-4, pres: día de la presentación, val: historial [{d,t,v}], dA / dB: días buenos vigentes de entender / de usar,
     cam: día del último cambio de paso, mal: día del último «pocos», caja: 1-5, prox: día en que vuelve ('' = descansa),
     u: {tarea: veces hecha}, ut: última tarea hecha, ov: segundo significado ya enseñado }

const TAREAS_ENTENDER = ['sentido', 'ejemplo', 'elige', 'gesto'], TAREAS_USAR = ['acaba', 'habla', 'relaciona', 'familia'];

/** E1 · Presentación completa: de «Nueva» a «La conocemos», caja 1 y vuelve al día siguiente. Presentarla otra vez no cambia nada. */

  return r;
}
/** R2 · Pendiente: presentada y con fecha de vuelta de hoy o anterior. Si descansa (prox '') no está pendiente. */
const estaPendiente = (a, dia) => !!a && a.e >= 2 && fechaOK(a.prox) && a.prox <= dia;

/** Anota que se ha hecho una tarea con la palabra, se valore o no (R7, T7): solo avanza la cuenta y la última tarea. */
function tareaHecha(a, tarea) {
  if (!a || !TAREAS_VAL.includes(tarea)) return a;
  const r = copiaPal(a); r.u[tarea] = (r.u[tarea] | 0) + 1; r.ut = tarea; return r;
}
/** G8 · ¿Ese día bueno de entender viene de una tarea de significado (y no solo de `gesto`)? Se mira en el historial. */
const diaConSignificado = (a, d) => a.val.some(x => x.d === d && x.v === 'todos' && TAREAS_SIGNIFICADO.includes(x.t));

/** El docente valora una tarea hecha con la palabra. Aplica E2-E8 y R3-R6. Devuelve el registro nuevo (o el mismo si no cuenta nada). */
function valorarPalabra(a, tarea, valor, dia) {
  if (!a || a.e < 2 || !fechaOK(a.pres) || !fechaOK(dia) || !TAREAS_VAL.includes(tarea) || !VALORES.includes(valor)) return a || palabraNueva();

  if (dia === a.pres) return r; /* E2: el día de la presentación es práctica */
  const entender = TAREAS_ENTENDER.includes(tarea), pend = estaPendiente(r, dia), puedeCambiar = r.cam !== dia;

        else if (!entender && r.e === 3 && r.dB.length >= 2 && diasEntre(r.pres, dia) >= DIAS_USAR) { r.e = 4; r.dB = []; r.cam = dia; } /* E5 */

}

/** R9 · Palabras para «Recordamos»: presentadas antes de hoy y pendientes; las más atrasadas primero; si empatan, paso más bajo,
    caja más baja y orden del paquete (`orden`: lista de ids). `pal` = {id: registro}. Como mucho `max`. No cambia nada. */

  return Object.keys(pal || {}).filter(id => estaPendiente(pal[id], dia) && pal[id].pres < dia)
    .sort((x, y) => (pal[x].prox < pal[y].prox ? -1 : pal[x].prox > pal[y].prox ? 1 : 0) || pal[x].e - pal[y].e || pal[x].caja - pal[y].caja || pos(x) - pos(y) || (x < y ? -1 : 1))
    .slice(0, max);
}

/* ===== «La hemos encontrado» (reglas EN1-EN10 de docs/aula.md): lo que la clase oye, ve o dice fuera de la sesión =====
   EN7: por palabra, tres cuentas (o = oída, v = vista, d = dicha) y el último día, en `enc`; una palabra sin `enc` vale cero.
   EN5: no mueve nada: ni el paso de la escala, ni las cajas, ni las fechas de repaso, ni los días buenos. Funciones PURAS. */
const ENC_COMO = ['o', 'v', 'd'], ENC_NOMBRE = { o: 'oída', v: 'vista', d: 'dicha' }, ENC_MAX = 100000;

function encTexto(a) {
  const e = encDe(a), t = encTotal(a); if (!t) return '';

}
/** EN2, EN7 · Apunta una vez («o», «v» o «d») y el día. Una palabra sin presentar (EN2) o un modo raro no cambian nada. Devuelve un registro nuevo. */
function conEncontrada(a, como, dia) {
  if (!a || a.e < 2 || !ENC_COMO.includes(como) || !fechaOK(dia)) return a || palabraNueva();
  const e = encDe(a); e[como] = Math.min(e[como] + 1, ENC_MAX); e.ult = dia;
  return { ...a, enc: e };
}

/* ---- js/32-eleccion.js ---- */
/* ===== Qué tarea toca (T1-T6) y qué frase sale (T7): funciones PURAS, sin pantalla y sin reloj =====
   Reglas en docs/pedagogia.md, apartado 5. Reciben el registro de la palabra (ver 30-escala-logica.js), su ficha y el día; no cambian nada.
   Lo que se ha hecho con la palabra sale de `u` (veces de cada tarea) y `ut` (la última), que apunta tareaHecha aunque no se valore. */
const ORDEN_TAREAS = [...TAREAS_ENTENDER, ...TAREAS_USAR]; /* T5: desempate cuando dos tareas se han hecho las mismas veces */
const grupoDe = t => (TAREAS_ENTENDER.includes(t) ? 'entender' : 'usar');
const otroGrupo = g => (g === 'entender' ? 'usar' : 'entender');
/** T2 · Tareas programadas y qué necesitan de la ficha. Las que aún no tienen pantalla (gesto, relaciona, familia) se añaden aquí al programarlas.
    `otras` = cuántas palabras presentadas, distintas de ésta, hay para ponerle a `elige` sus opciones. */
const CONTENIDO_TAREA = {
  sentido: p => !!(p.sentido && p.sentido.length), ejemplo: p => !!(p.ejemplos && p.ejemplos.length),
  elige: (p, otras) => otras >= 2, gesto: p => !!p.gesto, acaba: p => !!(p.acaba && p.acaba.length), habla: p => !!p.habla,
  relaciona: (p, otras, pres) => preguntasRelaciona(p, pres).length > 0 /* L3: algún elemento de la ficha vale hoy */
};
/** `pres` = fichas presentadas (solo lo necesita `relaciona`, L2). */
const tareasDisponibles = (p, otras = 0, pres = []) => ORDEN_TAREAS.filter(t => CONTENIDO_TAREA[t] && CONTENIDO_TAREA[t](p, otras, pres));

/** T1 · Grupo de tareas que toca hoy: «entender» o «usar».
    (a) Si la última valoración fue «pocos»: entender. (b) Si no: paso 2, entender; paso 3, usar; paso 4, el contrario al de su última tarea
    (si no hay, usar). (c) Si hoy ya es día bueno de ese grupo, el otro. */
function grupoQueToca(a, dia) {
  const val = a.val || [], pocos = val.length > 0 && val[val.length - 1].v === 'pocos';
  let g;
  if (pocos || a.e <= 2) g = 'entender';

/** T5 · De varias tareas, la que menos veces se ha hecho con la palabra; si empatan, el orden fijo de ORDEN_TAREAS. */
const menosHecha = (a, lista) => lista.slice().sort((x, y) => ((a.u[x] | 0) - (a.u[y] | 0)) || ORDEN_TAREAS.indexOf(x) - ORDEN_TAREAS.indexOf(y))[0];

/** Elige la tarea de una palabra (T1-T6). Opciones: `otras` (palabras presentadas distintas de ésta, para `elige`) y
    `evitar` (tipos de tarea ya puestos en la sesión o justo antes, T4). Devuelve el id de la tarea, o null si no hay ninguna posible.
    T3: nunca la última tarea hecha con la palabra. T6: si en el grupo no queda ninguna, se olvida T4; si aun así no hay, se pasa al otro grupo
    (en el otro grupo se prefiere también la variedad de T4 y solo se olvida si no hay más remedio). */

  const libres = tareasDisponibles(p, op.otras | 0, op.pres || []).filter(t => t !== a.ut);
  for (const [grupo, variedad] of [[g, true], [g, false], [otroGrupo(g), true], [otroGrupo(g), false]]) {

    if (c.length) return menosHecha(a, c);

}

/** T7 · Frase que sale la vez número `k` (k = veces que ya se ha hecho esa tarea con la palabra; al acabar la lista se vuelve a empezar).
    `sentido` y `acaba`, en el orden de la ficha; `ejemplo`, un sí y un no alternados; `habla`, su única pregunta. */

  k = Math.max(0, k | 0);

  if (tarea === 'acaba') return p.acaba[k % p.acaba.length];
  if (tarea === 'ejemplo') {
    const lista = p.ejemplos.filter(x => x.ok === (k % 2 === 0));
    return lista.length ? lista[Math.floor(k / 2) % lista.length] : p.ejemplos[k % p.ejemplos.length];
  }
  return p.habla;
}

/** Lugar de una ficha en el paquete: por semana y, dentro de la semana, el `orden` de docs/semana-NN.md. */
const lugarPaquete = p => p.semana * 100 + (p.orden || 99);
const ordenPaquete = (lista = PALABRAS) => lista.slice().sort((x, y) => lugarPaquete(x) - lugarPaquete(y)).map(p => p.id);
/** T2 · Las otras 2 opciones de `elige`: siempre palabras presentadas (`presentadas` = fichas), primero de su semana; si faltan, de las semanas
    anteriores (la más cercana primero) y, como último recurso, de las posteriores. La vuelta `k` las va cambiando. Devuelve 0, 1 o 2 fichas. */
function distractoresElige(p, presentadas, k = 0) {
  const rota = l => l.map((_, i) => l[(i + Math.max(0, k | 0)) % l.length]);
  const otras = presentadas.filter(x => x.id !== p.id);
  const mismas = otras.filter(x => x.semana === p.semana).sort((x, y) => lugarPaquete(x) - lugarPaquete(y));
  const antes = otras.filter(x => x.semana < p.semana).sort((x, y) => (y.semana - x.semana) || lugarPaquete(x) - lugarPaquete(y));
  const despues = otras.filter(x => x.semana > p.semana).sort((x, y) => lugarPaquete(x) - lugarPaquete(y));
  return [...rota(mismas), ...rota(antes), ...rota(despues)].slice(0, 2);

/** G3 · Gestos que se parecen entre semanas (docs/tareas-gesto-relaciona.md, apartado 5): nunca se ponen juntos como opciones de la forma 2. */
const GESTOS_PARECIDOS = [['descubrir', 'oscuro'], ['rodear', 'repetir'], ['primero', 'solucion'], ['respetar', 'ser-vivo'], ['agotado', 'tranquilo'], ['observar', 'pista', 'paisaje']];
const seParecen = (a, b) => GESTOS_PARECIDOS.some(g => g.includes(a) && g.includes(b));
/** G2 + G3 + G4 · Qué forma de `gesto` sale la vez número `k` y con qué opciones. Forma 1 («Haz el gesto») las veces pares; forma 2 («¿Qué palabra es?»)
    las impares, siempre que haya 2 palabras presentadas para acompañar: primero de su semana, si no de la anterior (la más cercana primero), nunca de una posterior
    ni de las de gesto parecido. Si no hay 2, forma 1. `presentadas` = fichas. La opción buena cambia de sitio y las otras rotan cada vez que sale la forma 2.
    Devuelve {forma: 1|2, otras: [ficha, ficha], pos: 0|1|2} (pos = lugar de la buena entre las 3 opciones). */

  const mismas = otras.filter(x => x.semana === p.semana).sort((x, y) => lugarPaquete(x) - lugarPaquete(y));
  const antes = otras.filter(x => x.semana < p.semana).sort((x, y) => (y.semana - x.semana) || lugarPaquete(x) - lugarPaquete(y));

/* ===== `relaciona` (docs/tareas-gesto-relaciona.md, apartado 3: reglas L1-L7) ===== */
const sinTildes = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
/** L2 · Las 60 palabras de 1.º (sin tildes). Un elemento de `parecida` o `contraria` que sea una de ellas solo vale si ya está presentada;
    los demás (rápido, lento, muy cansado) son palabras de todos los días y valen siempre. Un test la compara con docs/. */
const PAQUETE_1 = ['observar', 'comparar', 'ordenar', 'enorme', 'fragil', 'curioso', 'senalar', 'completar', 'describir', 'diminuto', 'veloz', 'valiente', 'explicar', 'elegir', 'clasificar', 'parecido', 'diferente', 'sorprendido', 'rodear', 'unir', 'descubrir', 'suave', 'aspero', 'agotado', 'primero', 'despues', 'finalmente', 'antiguo', 'moderno', 'proteger', 'imaginar', 'recordar', 'preguntar', 'brillante', 'oscuro', 'orgulloso', 'repetir', 'cambiar', 'comprobar', 'necesario', 'sencillo', 'tranquilo', 'problema', 'solucion', 'pista', 'resistente', 'delicado', 'nervioso', 'compartir', 'colaborar', 'respetar', 'cuidadoso', 'amable', 'paciente', 'ser vivo', 'alimento', 'paisaje', 'crecer', 'necesitar', 'estacion'];
/** L1 + L2 + L4 · Preguntas que valen hoy para una palabra, en el orden de L4: primera parecida, primera contraria, segunda parecida…
    (`rel.mas` no se mira nunca). `pres` = fichas presentadas. Devuelve [{tipo: 'parecida'|'contraria', q}]. */
function preguntasRelaciona(p, pres = []) {
  const rel = p.rel || {}, presN = new Set(pres.map(x => sinTildes(x.palabra))), lista = [];
  const vale = e => !PAQUETE_1.includes(sinTildes(e)) || presN.has(sinTildes(e));

    if (i < C.length) lista.push({ tipo: 'contraria', q: C[i] });

}
/** L4 + L7 · La pregunta que sale la vez número `k` (k = veces que ya se hizo `relaciona` con la palabra) y las otras palabras presentadas
    que tienen la misma pregunta («También vale»). Devuelve {tipo, q, tambien: [palabras]} o null si no hay pregunta. */

  const x = l[Math.max(0, k | 0) % l.length];

  return { ...x, tambien };

/* ---- js/34-hoy.js ---- */
/* ===== Botón «Hoy»: qué entra en cada parte de la sesión (reglas H1-H4 de docs/pedagogia.md, apartado 10) =====
   Funciones PURAS: reciben el registro de palabras `pal` ({id: registro}), el día y las fichas (`palabras`), y no cambian nada.
   Cada parte se monta al entrar en ella (así «Jugamos» ya ve las palabras que se acaban de presentar). */
const MAX_SEMANA = 6;
const lunesDe = d => sumarDias(d, -((new Date(diaNum(d) * 864e5).getUTCDay() + 6) % 7));
const regDe = (pal, id) => (pal && pal[id]) || palabraNueva();
const presentadaEn = (pal, id) => regDe(pal, id).e >= 2;
const fichaDe = (palabras, id) => palabras.find(p => p.id === id);

/** H3 · Cuántas palabras nuevas caben hoy: el ajuste (1 o 2) menos las presentadas hoy, y nunca más de 6 en la misma semana natural (lunes a domingo). */
function cupoNuevas(pal, dia, ajuste = 2) {
  const ids = Object.keys(pal || {}).filter(id => pal[id].e >= 2 && fechaOK(pal[id].pres));
  const hoyN = ids.filter(id => pal[id].pres === dia).length, semN = ids.filter(id => lunesDe(pal[id].pres) === lunesDe(dia)).length;
  return Math.max(0, Math.min((ajuste === 1 ? 1 : 2) - hoyN, MAX_SEMANA - semN));
}
/** H3 · Las siguientes palabras sin presentar, por semana y en el orden de la ficha. Dos con la misma marca `sep` no van el mismo día
    (tampoco si una ya se presentó hoy): la segunda es la siguiente que no choque. Devuelve fichas. */
function nuevasPorPresentar(pal, dia, ajuste = 2, palabras = PALABRAS) {
  const cupo = cupoNuevas(pal, dia, ajuste), res = [];
  const usados = new Set(palabras.filter(p => p.sep && presentadaEn(pal, p.id) && regDe(pal, p.id).pres === dia).map(p => p.sep));
  for (const id of ordenPaquete(palabras)) {
    if (res.length >= cupo) break;
    const p = fichaDe(palabras, id);
    if (presentadaEn(pal, id) || (p.sep && usados.has(p.sep))) continue;
    res.push(p); if (p.sep) usados.add(p.sep);
  }
  return res;
}
/** H2 · «Recordamos»: las de la regla R9 (como mucho 3). Devuelve fichas. */
function recordamosHoy(pal, dia, palabras = PALABRAS) {
  return pendientes(pal, dia, ordenPaquete(palabras)).map(id => fichaDe(palabras, id)).filter(Boolean);
}
/** H4 · «Jugamos»: 2 palabras ya presentadas de la semana en curso (la de la última presentada) que hoy no hayan salido en «Recordamos» ni se hayan valorado ya hoy
    (salvo las nuevas de esta sesión, `nuevas`). Primero las pendientes, luego las presentadas antes de hoy, luego las menos valoradas y, por último, el orden del paquete.
    Si no hay 2, se completa con pendientes de otras semanas; si aun así no hay, se juega con las que haya. Devuelve fichas. */
function jugamosHoy(pal, dia, { rec = [], nuevas = [] } = {}, palabras = PALABRAS, n = 2) {
  const libres = palabras.filter(p => presentadaEn(pal, p.id) && !rec.includes(p.id) && (nuevas.includes(p.id) || !regDe(pal, p.id).val.some(x => x.d === dia)));
  const ultima = palabras.filter(p => presentadaEn(pal, p.id)).sort((x, y) => (regDe(pal, y.id).pres > regDe(pal, x.id).pres ? 1 : regDe(pal, y.id).pres < regDe(pal, x.id).pres ? -1 : 0) || lugarPaquete(y) - lugarPaquete(x))[0];
  if (!ultima) return [];
  const clave = p => { const a = regDe(pal, p.id); return [estaPendiente(a, dia) ? 0 : 1, a.pres < dia ? 0 : 1, a.val.length, lugarPaquete(p)]; };
  const orden = (x, y) => { const a = clave(x), b = clave(y); for (let i = 0; i < 4; i++) if (a[i] !== b[i]) return a[i] - b[i]; return 0; };
  const res = libres.filter(p => p.semana === ultima.semana).sort(orden).slice(0, n);
  if (res.length < n) res.push(...libres.filter(p => p.semana !== ultima.semana && estaPendiente(regDe(pal, p.id), dia)).sort(orden).slice(0, n - res.length));
  return res;
}
/** Monta la cola de tareas de una parte: a cada ficha, la tarea y la frase que tocan (T1-T7), con tipos distintos entre sí (T4).
    `reg(id)` da el registro de la palabra y `pres` son las fichas presentadas (`elige` y `gesto` sacan de ahí sus otras palabras). */
function colaTareas(fichas, reg, pres, dia) {
  const evitar = [], cola = [];

    const a = reg(p.id), t = elegirTarea(a, p, dia, { otras: pres.filter(x => x.id !== p.id).length, pres, evitar });

  });

}
/** H6 · ¿Toca enseñar «También quiere decir…»? Solo si la ficha tiene `otro`, no se ha enseñado ya y la palabra está en «La entendemos» o «La usamos» (paso 3 o 4). */
const muestraOtro = (a, p) => !!(p && p.otro && a && !a.ov && a.e >= 3);
/** H6 · El mismo registro con el segundo significado ya enseñado (no cuenta para la escala). */
const conOtroVisto = a => { const r = copiaPal(a); r.ov = true; return r; };
/** H5 · Palabras que hoy han subido de paso: su paso ahora es mayor que el de al empezar la sesión (`e0` = {id: paso}). Las nuevas de hoy no cuentan (ya salen aparte). Devuelve fichas. */
function subieronHoy(pal, e0, nuevas = [], palabras = PALABRAS) {
  return palabras.filter(p => !nuevas.includes(p.id) && regDe(pal, p.id).e > ((e0 && e0[p.id]) || 1));
}
/** EN1 · ¿«Hoy» empieza con «¿Alguien ha encontrado alguna de nuestras palabras?»? Solo si el ajuste está encendido y hay alguna palabra presentada. */
const hoyPreguntaEnc = (preg, pal) => !!preg && Object.keys(pal || {}).some(id => presentadaEn(pal, id));

/* ---- js/36-muro.js ---- */
/* ===== Muro «Nuestras palabras» (reglas MU1-MU6 de docs/aula.md): lo que sale y la palabra «al azar». Funciones PURAS, no cambian nada del perfil. ===== */
/** MU1 y MU2 · Solo las palabras presentadas, agrupadas por semana (la más reciente arriba) y, dentro de cada semana, en el orden en que se presentaron
    (y, el mismo día, en el orden de la ficha). No hay huecos de las que faltan. Devuelve [{semana, palabras: [fichas]}]. */
function muroSemanas(pal, palabras = PALABRAS) {
  const pres = palabras.filter(p => presentadaEn(pal, p.id)), cmp = (x, y) => (regDe(pal, x.id).pres > regDe(pal, y.id).pres ? 1 : regDe(pal, x.id).pres < regDe(pal, y.id).pres ? -1 : 0) || lugarPaquete(x) - lugarPaquete(y);
  return [...new Set(pres.map(p => p.semana))].sort((a, b) => b - a).map(s => ({ semana: s, palabras: pres.filter(p => p.semana === s).sort(cmp) }));
}
/** MU3 · «Ya son N»: las palabras presentadas. */
const muroCuenta = (pal, palabras = PALABRAS) => palabras.filter(p => presentadaEn(pal, p.id)).length;
const PETICIONES_AZAR = ['gesto', 'def', 'frase'];
/** MU5 · «Una al azar»: una palabra presentada, distinta de la anterior si hay más de una, con la petición que toca (rotan: gesto, qué quiere decir, frase).
    `k` = cuántas llevan; `rnd` = número al azar entre 0 y 1. Devuelve {id, pet} o null si no hay ninguna. No guarda nada. */
function azarSiguiente(pal, palabras = PALABRAS, antes = '', k = 0, rnd = Math.random()) {
  const l = palabras.filter(p => presentadaEn(pal, p.id)); if (!l.length) return null;
  const c = l.length > 1 ? l.filter(p => p.id !== antes) : l;
  return { id: c[Math.min(c.length - 1, Math.floor(rnd * c.length))].id, pet: PETICIONES_AZAR[k % PETICIONES_AZAR.length] };
}

/* ---- js/37-explorar.js ---- */
/* ===== Explorar (reglas EX1-EX4 de docs/aula.md): mirar las palabras juntas. Funciones PURAS: no guardan nada ni cambian el perfil. =====
   Solo salen palabras presentadas. Las fichas dan `bloque` (EX1) y `rel.parecida` / `rel.contraria` (EX2). */
const BLOQUES_EXPLORAR = [['pensar', 'Para pensar'], ['como-son', 'Cómo son las cosas'], ['sentir', 'Cómo nos sentimos'], ['convivir', 'Para convivir'], ['medio', 'El mundo que nos rodea']];
const PREGUNTA_PAREJA = { contraria: '¿Por qué son lo contrario?', parecida: '¿En qué se parecen? ¿Son lo mismo del todo?' };
const presentadas = (pal, palabras = PALABRAS) => palabras.filter(p => presentadaEn(pal, p.id));
/** EX1 · «Por grupos»: las presentadas agrupadas por `bloque`, con su título y en el orden del paquete. Un grupo sin palabras no sale. */
function explorarGrupos(pal, palabras = PALABRAS) {
  const l = presentadas(pal, palabras).sort((x, y) => lugarPaquete(x) - lugarPaquete(y));
  return BLOQUES_EXPLORAR.map(([b, titulo]) => ({ bloque: b, titulo, palabras: l.filter(p => p.bloque === b) })).filter(g => g.palabras.length);
}
/** EX2 · «Parejas»: pares de palabras del paquete presentadas las dos, sacadas de `rel` (contrarias y parecidas; `rel.mas` nunca).
    Cada pareja sale una vez, aunque las dos fichas se nombren entre sí. Devuelve [{a, b, tipo, q}] por el lugar de la primera en el paquete. */
function explorarParejas(pal, palabras = PALABRAS) {
  const l = presentadas(pal, palabras), por = new Map();
  l.forEach(p => { por.set(sinTildes(p.id), p); por.set(sinTildes(p.palabra), p); });
  const vistos = new Set(), r = [];
  for (const p of l.slice().sort((x, y) => lugarPaquete(x) - lugarPaquete(y))) {
    for (const tipo of ['contraria', 'parecida']) for (const e of (p.rel && p.rel[tipo]) || []) {
      const q = por.get(sinTildes(e)); if (!q || q.id === p.id) continue;
      const k = [p.id, q.id].sort().join('|'); if (vistos.has(k)) continue;
      vistos.add(k); const [a, b] = lugarPaquete(p) <= lugarPaquete(q) ? [p, q] : [q, p];
      r.push({ a: a.id, b: b.id, tipo, q: PREGUNTA_PAREJA[tipo] });
    }
  }
  return r.sort((x, y) => lugarPaquete(palabras.find(p => p.id === x.a)) - lugarPaquete(palabras.find(p => p.id === y.a)));
}
/** EX3 · «Dos al azar»: dos presentadas de semanas distintas. `r1` y `r2` = números al azar entre 0 y 1. null si no hay dos semanas con palabras presentadas. */
function explorarDosAlAzar(pal, palabras = PALABRAS, r1 = Math.random(), r2 = Math.random()) {
  const l = presentadas(pal, palabras).sort((x, y) => lugarPaquete(x) - lugarPaquete(y));
  if (new Set(l.map(p => p.semana)).size < 2) return null;
  const a = l[Math.min(l.length - 1, Math.floor(r1 * l.length))], o = l.filter(p => p.semana !== a.semana);
  return [a.id, o[Math.min(o.length - 1, Math.floor(r2 * o.length))].id];
}
/** EX4 · Qué se ofrece: «Por grupos» desde 6 presentadas, «Parejas» desde la primera pareja, «Dos al azar» desde 2 semanas empezadas. */
function explorarDisponible(pal, palabras = PALABRAS) {
  const l = presentadas(pal, palabras);
  return { grupos: l.length >= 6, parejas: explorarParejas(pal, palabras).length > 0, azar: new Set(l.map(p => p.semana)).size >= 2 };
}

/* ---- js/38-resumen.js ---- */
/* ===== «Cómo va la clase» (reglas RE1-RE3 de docs/aula.md): lo que se ve del progreso. Funciones PURAS: no cambian nada. Sin notas ni porcentajes. ===== */
const MAX_REPASAR = 8, MAX_ENCONTRADAS = 5;
/** «Cuestan»: la última valoración fue «pocos», o dos de las tres últimas no fueron «casi todos». */
function cuesta(a) {
  const v = ((a && a.val) || []).slice(-3); if (!v.length) return false;
  return v[v.length - 1].v === 'pocos' || (v.length >= 2 && v.filter(x => x.v !== 'todos').length >= 2);
}
/** RE2 · Cuántas palabras hay en cada paso (solo presentadas: nada de huecos) y cuáles. Devuelve [{e, nombre, palabras}] del paso 2 al 4. */
function resumenPasos(pal, palabras = PALABRAS) {
  const l = presentadas(pal, palabras).sort((x, y) => lugarPaquete(x) - lugarPaquete(y));
  return [2, 3, 4].map(e => ({ e, nombre: PASOS[e - 1], palabras: l.filter(p => regDe(pal, p.id).e === e) }));
}
/** RE2 · «Para repasar»: primero las pendientes más atrasadas (R9) y después las que cuestan; sin repetir. Devuelve [id]. */
function resumenRepasar(pal, dia, palabras = PALABRAS, max = MAX_REPASAR) {
  const pres = new Set(presentadas(pal, palabras).map(p => p.id)), orden = ordenPaquete(palabras);
  const a = pendientes(pal, dia, orden, 1000).filter(id => pres.has(id));
  const c = orden.filter(id => pres.has(id) && !a.includes(id) && cuesta(regDe(pal, id)));
  return [...a, ...c].slice(0, max);
}
/** RE2 · «Las más encontradas»: las que más veces ha apuntado la clase (EN7), de más a menos; si empatan, en el orden del paquete. Solo con alguna cuenta. */
function resumenEncontradas(pal, palabras = PALABRAS, max = MAX_ENCONTRADAS) {
  return presentadas(pal, palabras).filter(p => encTotal(regDe(pal, p.id))).sort((x, y) => encTotal(regDe(pal, y.id)) - encTotal(regDe(pal, x.id)) || lugarPaquete(x) - lugarPaquete(y)).slice(0, max).map(p => p.id);
}
/** RE1-RE3 · Todo el resumen de un perfil. `titulo`: «Cómo va la clase» (clase) o «Cómo va» (niño, RE3). */
function resumenDe(perfil, dia, palabras = PALABRAS) {
  const pal = (perfil && perfil.pal) || {};
  return { titulo: perfil && perfil.t === 'fam' ? 'Cómo va' : 'Cómo va la clase', nombre: perfil ? perfil.n : '', dia,
    pasos: resumenPasos(pal, palabras), repasar: resumenRepasar(pal, dia, palabras), encontradas: resumenEncontradas(pal, palabras), total: presentadas(pal, palabras).length };
}

/* ---- js/45-semana.js ---- */
/* ===== Palabras de la semana y presentación de una palabra nueva (la guía el docente; la app solo muestra texto) =====
   Orden de docs/pedagogia.md: escena · la decimos · palmadas · explicación · gesto · 3 contextos · fin. */
const SEMANA_ACT = 1;

const palabrasSemana = n => PALABRAS.filter(p => p.semana === n).sort((x, y) => lugarPaquete(x) - lugarPaquete(y));

SC.pres = function () {

function presMover(d) {

}

/* ---- js/46-hoy.js ---- */
/* ===== Botón «Hoy»: la sesión guiada (reglas H1-H4 y H7-H10; qué entra en cada parte: 34-hoy.js) =====
   Orden fijo: Recordamos → Palabra nueva → Jugamos → Cierre. Cada parte se monta al entrar en ella y tiene «Saltar esta parte».
   Nada de la sesión se guarda aparte: lo presentado y lo valorado ya está guardado (H8); solo se apunta el día en que se termina (H7).
   Las partes de tareas reutilizan la pantalla «juego» y la de presentación «pres». */
let HOY = null;
const PARTES_HOY = ['preg', 'rec', 'nueva', 'jug', 'cierre']; /* «preg» = ¿alguien ha encontrado alguna de nuestras palabras? (EN1); se salta si no hay palabras o está apagada */

function empezarHoy() {
  const pr = MODO_DOCENTE ? null : perfilAct(), e0 = {}; /* paso de cada palabra al empezar: así el cierre sabe cuáles han subido (H5) */
  if (pr) Object.keys(pr.pal).forEach(id => { e0[id] = pr.pal[id].e; });
  HOY = { parte: '', rec: [], nuevas: [], sube: [], e0, j: 0 }; hoyAvanzar();
}
function hoyAvanzar() {
  if (!HOY) return go('casa');
  const sig = PARTES_HOY[PARTES_HOY.indexOf(HOY.parte) + 1];
  if (!sig) return hoyTerminar();
  HOY.parte = sig; hoyEntrar();
}
function hoyTerminar() { terminarSesionHoy(); HOY = null; go('casa'); toast('Sesión terminada'); }
function hoyCola(fichas, pr, titulo) {
  const cola = colaTareas(fichas, id => registroJuego(pr, id), fichasPresentadas(pr), hoy());
  if (!cola.length) return false;
  if (titulo === 'Recordamos') cola.forEach(q => { q.otro = muestraOtro(registroJuego(pr, q.id), palabraPorId(q.id)); }); /* H6 */
  JUEGO = { cola, i: 0, hoy: titulo }; go('juego'); return true;
}
function hoyEntrar() {
  const pr = MODO_DOCENTE ? null : perfilAct(), pal = pr ? pr.pal : {}, dia = hoy();
  const muestra = MODO_DOCENTE ? palabrasSemana(SEMANA_ACT) : null; /* H9: 2 + 1 + 2 de la semana elegida; no lee ni guarda nada */
  if (HOY.parte === 'preg') {
    if (!hoyPreguntaEnc(EST.ajustes.preg, MODO_DOCENTE ? palMuro() : pal)) return hoyAvanzar();
    go('hoyPreg');
  } else if (HOY.parte === 'rec') {
    const f = muestra ? muestra.slice(0, 2) : recordamosHoy(pal, dia, PALABRAS);
    HOY.rec = f.map(p => p.id); if (!hoyCola(f, pr, 'Recordamos')) hoyAvanzar();
  } else if (HOY.parte === 'nueva') {
    const f = muestra ? muestra.slice(2, 3) : nuevasPorPresentar(pal, dia, EST.ajustes.nuevas, PALABRAS);
    if (!f.length) return hoyAvanzar();
    HOY.nuevas = f.map(p => p.id); HOY.j = 0; abrirPalabra(HOY.nuevas[0]);
  } else if (HOY.parte === 'jug') {
    const f = muestra ? muestra.slice(3, 5) : jugamosHoy(pal, dia, { rec: HOY.rec, nuevas: HOY.nuevas }, PALABRAS);
    if (!hoyCola(f, pr, 'Jugamos')) hoyAvanzar();
  } else {
    HOY.sube = MODO_DOCENTE ? [] : subieronHoy(pal, HOY.e0, HOY.nuevas).map(p => p.id); /* H5 */
    if (!HOY.nuevas.length && !HOY.sube.length) hoyTerminar(); else go('cierre');
  }
}
/** Al final de la presentación de una palabra nueva: la siguiente de hoy, o la parte siguiente. */
function hoyNuevaSiguiente() {
  HOY.j++;
  if (HOY.j < HOY.nuevas.length) { PRES = { id: HOY.nuevas[HOY.j], i: 0 }; pintar(); window.scrollTo(0, 0); } else hoyAvanzar();
}
/** H5 · Cierre: se dicen por última vez las palabras nuevas de hoy, con su gesto, y se enseñan las que hoy han subido de paso (la planta crece).
    Las que han bajado no se enseñan a la clase. Sin valoración propia. Si no hay nada que decir, el cierre no sale. */
SC.cierre = function () {
  if (!HOY) return SC.casa();
  const pr = MODO_DOCENTE ? null : perfilAct(), l = HOY.nuevas.map(palabraPorId).filter(p => p && (MODO_DOCENTE || estadoPal(pr, p.id).e >= 2));
  const s = (HOY.sube || []).map(palabraPorId).filter(Boolean);
  return `<main class="pantalla infantil ancha pres"><p class="rotulo">${l.length ? 'Cierre · la decimos otra vez' : 'Cierre'}</p>
  <div class="cuerpo">${l.map(p => `<p class="palabra-g">${esc(p.palabra)}</p><p class="gr">${esc(p.gesto)}</p>`).join('')}
  ${s.length ? `<p class="mu gr-p" style="text-align:center">Hoy han crecido</p><div class="escala-fila">${s.map(p => `<figure>${escalaSVG(estadoPal(pr, p.id).e)}<figcaption>${esc(p.palabra)}</figcaption></figure>`).join('')}</div>` : ''}</div>
  <div class="nav"><button class="btn sec" onclick="hoyTerminar();abrirMuro()">${tituloMuro()}</button><button class="btn" onclick="hoyTerminar()">Terminar</button></div></main>`;
};

let ENC = { id: '', vuelta: 'muro', ficha: false, ant: null, des: false };
const ENC_COMO_TXT = { o: ['ear', 'La hemos oído'], v: ['eye', 'La hemos visto escrita'], d: ['mouth', 'La hemos dicho'] };

/* ---- js/47-muro.js ---- */
/* ===== Muro «Nuestras palabras»: pantallas (reglas MU1-MU11 de docs/aula.md; qué sale: 36-muro.js) =====
   Solo consulta: abrir una ficha o sacar una al azar no valora, no cuenta tareas y no cambia nada del perfil. */
let CONS = '', CONS_DE = 'muro', AZAR = { id: '', pet: '', k: 0, rev: false };
/** Las palabras del muro: las presentadas del perfil; en Modo Docente, las de la semana elegida «en La conocemos», de muestra (MU10). */
function palMuro() {
  if (!MODO_DOCENTE) { const p = perfilAct(); return (p && p.pal) || {}; }
  const o = {}; palabrasSemana(SEMANA_ACT).forEach(p => { o[p.id] = { ...palabraNueva(), e: 2, pres: hoy() }; }); return o;
}
const tituloMuro = () => { const p = MODO_DOCENTE ? null : perfilAct(); return p && p.t !== 'doc' ? 'Mis palabras' : 'Nuestras palabras'; };
const abrirMuro = () => go('muro');
function abrirConsulta(id, de = 'muro') { CONS = id; CONS_DE = de; go('consulta'); }
function azarOtra() { const pal = palMuro(), s = azarSiguiente(pal, PALABRAS, AZAR.id, AZAR.k); if (!s) return go('muro'); AZAR = { id: s.id, pet: s.pet, k: AZAR.k + 1, rev: false }; go('azar'); }
function azarEmpezar() { AZAR = { id: '', pet: '', k: 0, rev: false }; azarOtra(); }
function azarVer() { AZAR.rev = true; pintar(); }

SC.muro = function () {

  ${sem.map(s => `<p class="rotulo">Semana ${s.semana}</p><div class="palabras">${s.palabras.map(p => `<button class="pal" onclick="abrirConsulta('${p.id}')"><img src="${esc(imgPal(p))}" alt="" loading="lazy">
  ${encTotal(regDe(pal, p.id)) ? `<span class="chispa" title="${esc(encTexto(regDe(pal, p.id)))}">${ico('spark', 18)}${encTotal(regDe(pal, p.id))}</span>` : ''}
  <span class="pal-pie"><span class="pal-n">${esc(p.palabra)}</span>${escalaSVG(regDe(pal, p.id).e)}</span></button>`).join('')}</div>`).join('')}</main>`;
};
/** MU4 · Ficha de consulta: imagen, palabra, explicación, gesto y los tres contextos; el segundo significado solo si ya se enseñó. */
SC.consulta = function () {

  ${a && encTotal(a) ? `<p class="mu gr-p">${esc(encTexto(a))}</p>` : ''}<button class="btn sec" onclick="encEmpezar('consulta','${p.id}')">La hemos encontrado</button></main>`;

/** MU5 · «Una al azar»: una petición suelta; no guarda nada. */

/* ---- js/48-tareas.js ---- */
/* ===== «Jugamos»: 2 tareas con palabras de la semana (la guía el docente; la clase responde con pulgares, dedos o hablando) =====
   Tareas: sentido, ejemplo, elige, acaba, habla (ver docs/pedagogia.md, apartado 3); cuál toca y qué frase sale, por las reglas T de 32-eleccion.js. Tras cada una, el docente valora: casi todos · la mitad · pocos.
   La valoración es opcional: valorarTarea apunta y mueve la escala y el repaso (reglas E y R, 30-escala-logica.js); «Seguir sin valorar» solo anota que la tarea salió. */
let JUEGO = null;
const NJUEGO = 2;
const TAREA_ROT = { sentido: '¿Tiene sentido?', ejemplo: '¿Es o no es?', elige: '¿Qué palabra va?', gesto: 'Haz el gesto', acaba: 'Acaba la frase', relaciona: 'Se parece a…', habla: 'Cuéntaselo a tu compañero' };
const CON_RESPUESTA = { sentido: true, ejemplo: true, elige: true, gesto: true, relaciona: true, acaba: false, habla: false };
const VAL_TXT = { todos: 'Casi todos', mitad: 'La mitad', pocos: 'Pocos' };

/** Palabras con las que se puede jugar: las ya presentadas (en Modo Docente, todas las de la semana). */
function palabrasJugables(pr) { return palabrasSemana(SEMANA_ACT).filter(p => MODO_DOCENTE || estadoPal(pr, p.id).e >= 2); }
/** Fichas que cuentan como presentadas (T2): las del perfil; en Modo Docente, todas. */
const fichasPresentadas = pr => PALABRAS.filter(p => MODO_DOCENTE || estadoPal(pr, p.id).e >= 2);
/* En Modo Docente no se guarda nada: las tareas ya enseñadas se recuerdan solo en memoria para que «Otra vez» cambie de tarea y de frase,
   y cada palabra se trata como si estuviera en «La usamos» (alterna entender y usar) para que se vean todas las tareas. */
let DOC_REG = {};
const registroJuego = (pr, id) => (MODO_DOCENTE ? DOC_REG[id] || { ...palabraNueva(), e: 4 } : estadoPal(pr, id));
/** Solo en Modo Docente: recuerda en memoria que esta tarea ya salió (no guarda nada). */
function anotarDocente(id, tarea) { if (MODO_DOCENTE) DOC_REG[id] = tareaHecha(registroJuego(null, id), tarea); }
/** Monta la cola: las palabras con menos valoraciones primero; cada una con la tarea y la frase que tocan (reglas T1-T7 de 32-eleccion.js)
    y con tareas de tipo distinto entre sí (T4). `elige` lleva sus otras 2 opciones, siempre palabras presentadas. */
function montarJuego(pr, n = NJUEGO) {
  const lista = palabrasJugables(pr).map((p, i) => ({ p, i, v: (estadoPal(pr, p.id).val || []).length }))
    .sort((a, b) => a.v - b.v || a.i - b.i).slice(0, n).map(x => x.p);
  return colaTareas(lista, id => registroJuego(pr, id), fichasPresentadas(pr), hoy());
}
function empezarJuego() {
  const cola = montarJuego(MODO_DOCENTE ? null : perfilAct());
  if (!cola.length) return;
  JUEGO = { cola, i: 0 }; go('juego');
}
function juegoPista() { JUEGO.cola[JUEGO.i].pista = true; pintar(); }
function juegoRevelar() { JUEGO.cola[JUEGO.i].rev = true; pintar(); }
function juegoValorar(v) {
  const q = JUEGO.cola[JUEGO.i]; if (v) valorarTarea(q.id, q.t, v); else tareaSinValorar(q.id, q.t);
  anotarDocente(q.id, q.t);
  if (q.otro) { /* H6: tras la tarea, una sola vez, «También quiere decir…» (no cuenta para la escala) */
    JUEGO.otro = q.id; otroVisto(q.id); if (MODO_DOCENTE) DOC_REG[q.id] = conOtroVisto(registroJuego(null, q.id));
  } else JUEGO.i++;
  pintar(); window.scrollTo(0, 0); }
function juegoSeguirOtro() { JUEGO.otro = ''; JUEGO.i++; pintar(); window.scrollTo(0, 0); }

/** Contenido de una tarea: devuelve {cuerpo, res} (res = lo que se enseña al tocar «Ver la respuesta»). */
function tareaHTML(q, p) {
  const pal = `<p class="pal-ch">${esc(p.palabra)}</p>`;
  if (q.t === 'sentido') {

  }
  if (q.t === 'ejemplo') {
    const e = fraseDe(p, 'ejemplo', q.k);
    /* `pregunta` (opcional en la ficha): para enlaces, nombres, parejas… Si falta, la de siempre */
    const preg = p.pregunta || `¿Es un ejemplo de «${p.palabra}»?`;
    return { cuerpo: `<p class="pal-ch">${esc(preg)}</p><p class="gr">${esc(e.t)}</p><p class="mu gr-p">Pulgar arriba o abajo</p>`,

  }
  if (q.t === 'elige') {
    const otras = (q.otras ? q.otras.map(palabraPorId) : distractoresElige(p, fichasPresentadas(MODO_DOCENTE ? null : perfilAct()), q.k)), a = otras[0] || p, b = otras[1] || p;
    const op = [p, a, b], r = q.k % 3, orden = [op[r], op[(r + 1) % 3], op[(r + 2) % 3]];
    const html = orden.map((x, j) => `<div class="opc${q.rev && x.id === p.id ? ' on' : ''}"><i>${j + 1}</i><span>${esc(x.palabra)}</span></div>`).join('');
    return { cuerpo: `<img class="esc-img" src="${esc(imgPal(p))}" alt=""><p class="mu gr-p">Dedos: 1, 2 o 3</p><div class="opcs">${html}</div>`,
      res: `<div class="veredicto si"><b>La palabra es «${esc(p.palabra)}»</b></div>` };
  }
  if (q.t === 'gesto' && q.forma === 2) { /* G5: sin palabra ni imagen hasta «Ver la respuesta» */
    const op = [0, 1, 2].map(j => (j === q.pos ? p : palabraPorId(q.otras[j < q.pos ? j : j - 1])));
    const html = op.map((x, j) => `<div class="opc${q.rev && x.id === p.id ? ' on' : ''}"><i>${j + 1}</i><span>${esc(x.palabra)}</span></div>`).join('');
    return { cuerpo: `<p class="nota-g">Haz este gesto sin decir la palabra:</p><p class="gr">${esc(p.gesto)}</p><p class="mu gr-p">Dedos: 1, 2 o 3</p><div class="opcs">${html}</div>`,
      res: `<div class="veredicto si"><b>La palabra es «${esc(p.palabra)}»</b><span>${esc(p.def)}</span></div><img class="esc-img" src="${esc(imgPal(p))}" alt="">` };
  }
  if (q.t === 'gesto') return { cuerpo: `${pal}<p class="mu gr-p">Todos a la vez: una, dos y tres</p>`,
    res: `<img class="esc-img" src="${esc(imgPal(p))}" alt=""><p class="gr">${esc(p.gesto)}</p><p class="mu gr-p">¿Por qué es ese su gesto?</p>` };
  if (q.t === 'relaciona') { /* L5: sin palabra ni imagen hasta «Ver la respuesta» (la imagen, antes, solo con «Una pista») */
    const r = q.rel || preguntaRelaciona(p, fichasPresentadas(MODO_DOCENTE ? null : perfilAct()), q.k); if (!r) return { cuerpo: pal, res: '' };

    const pregunta = par ? `¿Cómo decimos <b>${esc(r.q)}</b> con una palabra nuestra?` : `¿Qué palabra nuestra es lo contrario de <b>${esc(r.q)}</b>?`;
    const img = `<img class="esc-img" src="${esc(imgPal(p))}" alt="">`;
    return { cuerpo: `<p class="nota-g">${par ? 'Se parece a…' : 'Lo contrario de…'}</p><p class="gr">${pregunta}</p><p class="mu gr-p">Piensa, haz su gesto en silencio… y a la de tres la decimos</p>${q.pista && !q.rev ? img : ''}`,
      res: `<div class="veredicto si"><b>${esc(mayus)} ${par ? 'se parece a' : 'es lo contrario de'} ${esc(r.q)}</b>${r.tambien && r.tambien.length ? `<span>También vale: ${r.tambien.map(x => '«' + esc(x) + '»').join(', ')}</span>` : ''}</div>${img}<p class="gr">¿Quién dice una frase con «${esc(p.palabra)}»?</p>` };
  }

  return { cuerpo: `${pal}<p class="gr">${esc(p.habla)}</p><p class="mu gr-p">Por parejas · un minuto</p>`, res: '' };
}
SC.juego = function () {
  const j = JUEGO; if (!j || !j.cola.length) return SC.semana();

/* ===== Hoja para las familias «Nuestras palabras de la semana» (reglas FA1-FA5 de docs/aula.md) =====
   Todo sale de las fichas: no lleva notas, progreso, nombres de niños ni menciona otras apps. La app no envía nada: se imprime o se guarda en PDF. */
const HOJA_ARRIBA = 'Esta semana estamos aprendiendo estas palabras en clase. No hace falta estudiarlas: basta con usarlas en casa, hablando.';
const HOJA_IDEAS = ['Usa tú la palabra cuando venga a cuento.', 'Pídele que te enseñe el gesto y que te explique qué quiere decir.', 'Si la oye o la dice fuera del colegio, que lo cuente en clase: la apuntamos en nuestro muro.'];
let HOJA = { s: 0, img: true };

/** Semanas con fichas en la app (de menor a mayor). */
const semanasConFicha = (palabras = PALABRAS) => [...new Set(palabras.filter(p => p.curso === 1).map(p => p.semana))].sort((a, b) => a - b);
/** FA2 · HTML de la hoja de una semana: las 6 palabras en el orden de la ficha. `conImg` = false → sin imágenes (gasta menos tinta). */
function hojaFamilias(semana, conImg = true, palabras = PALABRAS) {
  const l = palabras.filter(p => p.curso === 1 && p.semana === semana).sort((a, b) => a.orden - b.orden);
  const f = p => `<li class="hoja-pal">${conImg ? `<img src="img/palabras/${esc(p.escena.img)}" alt="" onerror="this.style.display='none'">` : ''}<div><h3>${esc(p.palabra)}</h3><p>${esc(p.def)}</p><p><b>Su gesto:</b> ${esc(p.gesto)}</p><p><b>Empieza tú la frase y que la acabe:</b> ${esc(p.acaba[0])}</p></div></li>`;
  return `<article class="hoja"><h2>Nuestras palabras de la semana ${semana}</h2><p>${esc(HOJA_ARRIBA)}</p><ul class="hoja-lista">${l.map(f).join('')}</ul><h3 class="hoja-ideas">Tres ideas</h3><ol>${HOJA_IDEAS.map(x => `<li>${esc(x)}</li>`).join('')}</ol></article>`;
}
SC.hoja = function () {
  const sem = semanasConFicha(); if (!sem.includes(HOJA.s)) HOJA.s = sem[0] || 0;
  return `<main class="pantalla tutor"><h1 class="h-t hoja-ctl">Hoja para las familias</h1>
  <div class="tarjeta hoja-ctl"><b>Semana</b><div class="dos">${sem.map(s => `<button class="btn${s === HOJA.s ? '' : ' sec'}" onclick="HOJA.s=${s};pintar()" aria-pressed="${s === HOJA.s}">${s}</button>`).join('')}</div>
  <button class="btn${HOJA.img ? ' sec' : ''}" id="hoja-sin" onclick="HOJA.img=!HOJA.img;pintar()" aria-pressed="${!HOJA.img}">Sin imágenes (gasta menos tinta)</button>
  <button class="btn" onclick="window.print()">Imprimir o guardar en PDF</button>
  <p class="mu pq">Se envía por el canal del centro: Lexi no envía nada. No lleva notas ni nombres.</p></div>
  ${HOJA.s ? hojaFamilias(HOJA.s, HOJA.img) : '<p class="mu">Aún no hay palabras.</p>'}</main>`;
};

/* ---- js/51-tarjetas.js ---- */
/* ===== Tarjetas para imprimir (reglas TA1-TA5 de docs/aula.md): para el muro de la pared de la clase =====
   Salen de las fichas. No llevan datos de la clase ni el paso de la escala (TA5): valen de un año para otro. Papel blanco, se entienden en blanco y negro. */
let TARJ = { s: 0, tam: 'g' }; /* s: semana, o 0 = todas las presentadas */

/** Palabras que entran: de una semana (en el orden de la ficha) o, con 0, las que la clase ya ha presentado (`pal` = perfil.pal; en Modo Docente, null = ninguna). */
function palabrasTarjetas(semana, pal, palabras = PALABRAS) {
  const l = palabras.filter(p => p.curso === 1 && (semana ? p.semana === semana : !!pal && presentadaEn(pal, p.id)));
  return l.sort((a, b) => a.semana - b.semana || a.orden - b.orden);
}

/* ---- La nube vista desde Lexi: dos operaciones (leer todo, escribir lo que cambia). Aquí está lo único que habla con Firestore ---- */
function nubeFirestore(db, uid) {
  const mref = db.collection(FB_COL).doc(uid), col = mref.collection('alu');
  return {
    async leer() {
      const [md, cs] = await Promise.all([mref.get(), col.get()]), perfiles = []; /* un documento por perfil */
      cs.forEach(d => { const x = d.data() || {}; perfiles.push({ id: d.id, mt: x.mt, v: x.v, d: x.d }); });
      const x = md.exists ? md.data() || {} : {};
      return { meta: md.exists && typeof x.meta === 'string' ? x.meta : null, metaV: x.v, perfiles };
    },
    async escribir({ meta, perfiles, borrar }) {
      const b = db.batch();
      perfiles.forEach(p => b.set(col.doc(p.id), { d: p.d, mt: p.mt, v: p.v }));
      borrar.forEach(id => b.delete(col.doc(id)));
      if (meta != null) b.set(mref, { meta, ts: Date.now(), v: VERSION_DATOS });
      await b.commit();
    }

}

/* ---- Decisiones y fusión (sin red: se prueban con una «nube» de mentira, tests/test_cuenta.js) ---- */
const parteEst = e => ({ perfiles: e.perfiles, ajustes: e.ajustes, gmt: e.gmt, del: e.del, act: e.act, modo: e.modo });
/** PV · ¿se puede fusionar sin preguntar? 'fusionar' o 'preguntar' (PV3, paso 6.4).

function decidirPrimera({ uidGuardado, uid, localVacio, nubeVacia }) {

/** PV3 · Lo que se enseña de cada lado: nombre, tipo y cuántas palabras tiene presentadas. */
const cuentaPal = p => Object.values(p.pal || {}).filter(r => r && r.e >= 2).length;

/* ---- Cuándo se sincroniza (SI1-SI8) ---- */
