<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexi: vocabulario</title>
<meta name="description" content="Palabras nuevas para la clase, con Lexi.">
<meta name="theme-color" content="#FFF1EC">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>@font-face{font-family:'Fredoka';src:url(fonts/fredoka.woff) format('woff');font-weight:400 700;font-display:swap}
@font-face{font-family:'Fredoka';src:url(fonts/fredoka-ext.woff) format('woff');font-weight:400 600;font-display:swap;unicode-range:U+0131,U+0152-0153,U+2122,U+2212}
@font-face{font-family:'Inter';src:url(fonts/inter-400.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-500.woff) format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-600.woff) format('woff');font-weight:600 700;font-display:swap}

/* ================= Colores: ÚNICO sitio (corales de Lexi) ================= */
:root{
  --bg:#FFF1EC;--card:#fff;--soft:#FCE4DD;--bd:#F2CFC6;--bd2:#E7B5A9;--tx:#2E1A17;--mu:#6E4F49;
  --ac:#ED7468;--acx:#D95A4D;--acs:#F2B4A9;--aci:#B03A2E;--on:#2E1A17;
  --ok:#15803D;--okbg:#DCFCE7;--no:#DC2626;--nobg:#FEE2E2;
  --md:linear-gradient(135deg,#7C3AED,#14B8A6);
  --fd:'Fredoka',system-ui,sans-serif;--fi:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --sh:0 1px 2px rgba(46,26,23,.05),0 4px 14px rgba(46,26,23,.07);
  --lexi-sombra:rgba(110,60,50,.16);
  --lx-coral:#ED7468;--lx-rosa:#F2B4A9;--lx-pale:#F7D3CC;--lx-blanco:#fff;
}
:root[data-theme="dark"]{
  --bg:#231413;--card:#321D1B;--soft:#40262A;--bd:#52302D;--bd2:#6A403B;--tx:#FBEAE6;--mu:#D0A8A0;
  --ac:#F2B4A9;--acx:#ED7468;--acs:rgba(237,116,104,.2);--aci:#F2B4A9;--on:#2E1A17;
  --ok:#4ADE80;--okbg:rgba(74,222,128,.15);--no:#F87171;--nobg:rgba(248,113,113,.15);
  --sh:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  --lexi-sombra:rgba(0,0,0,.35);
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx)}
body{font-family:var(--fi);-webkit-text-size-adjust:100%}
.infantil{font-family:var(--fd)}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:72px 20px 28px}
.inicio,.pantalla{margin-block:auto}
.inicio{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.inicio h1{font:700 clamp(2.2rem,8vw,3.4rem)/1.1 var(--fd);margin:0}
.inicio p{margin:0;color:var(--mu);font-size:1.1rem}
.btn{min-height:56px;min-width:44px;padding:12px 28px;border:0;border-radius:18px;background:var(--ac);color:var(--on);font:600 1.3rem var(--fd);cursor:pointer;box-shadow:var(--sh)}
.btn:active{background:var(--acx)}
.btn.sec{background:var(--soft);color:var(--tx)}
.top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.top .tema{pointer-events:auto}
.tema{min-width:44px;min-height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.3rem;cursor:pointer}
:focus-visible{outline:3px solid var(--aci);outline-offset:2px}

.escala{display:block;width:100%;height:auto}
.escala-fila{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;width:100%;max-width:520px}
.escala-fila{margin:10px auto 18px}
.escala-fila figure{margin:0;min-width:0;text-align:center}
.escala-fila figure .escala{max-width:120px;margin:0 auto}
.escala-fila figcaption{font:500 clamp(.8rem,2.6vw,1.1rem)/1.15 var(--fd);margin-top:6px;overflow-wrap:anywhere}

.opciones{display:grid;gap:12px;width:100%}
.btn.grande{width:100%;min-height:72px;font-size:1.6rem}
.pantalla{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px;text-align:center}
.h-pant{font:700 clamp(1.8rem,6vw,2.6rem)/1.1 var(--fd);margin:0}
.h-sec{font:600 1.3rem var(--fd);margin:0}
.mu{color:var(--mu);margin:0}.pq{font-size:.95rem}
.quien{display:grid;gap:10px}
.qa{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;border-radius:18px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:600 1.3rem var(--fd);text-align:left;cursor:pointer}
.qa.on{border-color:var(--aci)}
.av{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;font-size:1.6rem;flex:none}
.casa-cab{display:flex;align-items:center;justify-content:center;gap:12px}
.nuevo{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
.campo{width:100%;min-height:56px;padding:10px 16px;border-radius:14px;border:2px solid var(--bd2);background:var(--bg);color:var(--tx);font:500 1.2rem var(--fd)}
.animales{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.animales button{min-height:52px;border-radius:14px;border:0;font-size:1.8rem;cursor:pointer}
.animales button.on{outline:4px solid var(--tx);outline-offset:1px}
.error{color:var(--no);font:500 1rem var(--fi);margin:0;min-height:1.2em}

.dcha{display:flex;gap:8px;pointer-events:none}.dcha .tema{pointer-events:auto}
.pill-md{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:22px;background:var(--md);color:#fff;font:600 1.05rem var(--fd);border:0}
.pill-md.salir{cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:14px;font:500 1rem var(--fi);z-index:20;box-shadow:var(--sh)}
.tutor{font-family:var(--fi);text-align:left}
.h-t{font:600 1.7rem/1.2 var(--fi);margin:0}.h-s{font:600 1rem var(--fi);margin:8px 0 0;color:var(--mu)}
.lista{display:flex;flex-direction:column;gap:8px}
.fila-t{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:500 1rem var(--fi);text-align:left;cursor:pointer;position:relative}
.fila-t .tx2{flex:1;display:flex;flex-direction:column}.fila-t small{color:var(--mu);font-size:.85rem}
.fila-t input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tarjeta{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
.tutor .tarjeta p{margin:0}
.aviso{margin:0;padding:12px 14px;border-radius:12px;background:var(--nobg);color:var(--no)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.peligro{background:var(--no);color:#fff}.btn.peligro.sec{background:var(--nobg);color:var(--no)}
.btn.peligro{font-family:var(--fi);font-size:1.05rem}
.pinw{align-items:center;text-align:center}.pinw h2{margin:0;font:600 1.4rem var(--fi)}.pinw .lk{color:var(--aci)}
.pd{display:flex;gap:14px;justify-content:center;margin:6px 0}.pd i{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd2)}.pd i.f{background:var(--aci);border-color:var(--aci)}
.pd.mal{animation:sacude .35s}@keyframes sacude{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pk{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}.pk button{min-height:64px;border-radius:50%;border:1px solid var(--bd);background:var(--soft);color:var(--tx);font:600 1.5rem var(--fi);cursor:pointer;display:grid;place-items:center}
@media (prefers-reduced-motion:reduce){.pd.mal{animation:none}}
.tutor .btn{font-family:var(--fi);font-size:1.05rem}

/* ===== Palabras de la semana y presentación ===== */
.pantalla.ancha{max-width:1100px}
.palabras{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pal{display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:18px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;text-align:left;box-shadow:var(--sh)}
.pal:active{border-color:var(--aci)}
.pal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--soft)}
.pal-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 8px;padding:0 4px 2px}
.pal-n{font:600 clamp(1.3rem,4.5vw,1.8rem)/1.1 var(--fd);overflow-wrap:normal}
.pal .escala{width:44px;flex:none}
.pres{gap:18px}
.rotulo{margin:0;align-self:center;padding:6px 18px;border-radius:20px;background:var(--soft);color:var(--mu);font:600 1.05rem var(--fd)}
.cuerpo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:38vh}
.gr{margin:0;font:500 clamp(1.5rem,4vw,2.8rem)/1.3 var(--fd)}
.gr-p{font-size:1.2rem}
.pal-ch{margin:0;font:700 clamp(1.3rem,3vw,2rem) var(--fd);color:var(--aci)}
.palabra-g{margin:0;font:700 clamp(3.5rem,16vw,9rem)/1 var(--fd);overflow-wrap:anywhere}
.silabas{margin:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.sil{display:inline-block;padding:.1em .4em;border-radius:.35em;background:var(--soft);font:700 clamp(2.4rem,11vw,6rem)/1.1 var(--fd)}
.pt{font:700 clamp(2rem,9vw,5rem) var(--fd);color:var(--ac);font-style:normal}
.escena{display:grid;gap:14px;width:100%;justify-items:center}
.esc-img{display:block;width:100%;max-width:720px;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:var(--soft);box-shadow:var(--sh)}
@media (min-width:760px) and (orientation:landscape){.escena{grid-template-columns:1.1fr 1fr;align-items:center;text-align:left}}
.fin-esc{display:flex;align-items:center;gap:10px;font:600 1.4rem var(--fd)}.fin-esc .escala{width:72px}
.pts{display:flex;justify-content:center;gap:8px}
.pts i{width:12px;height:12px;border-radius:50%;border:2px solid var(--bd2)}
.pts i.hecho{background:var(--acs);border-color:var(--acs)}.pts i.on{background:var(--ac);border-color:var(--ac);transform:scale(1.25)}
.nav{display:grid;grid-template-columns:minmax(128px,1fr) 2fr;gap:12px}.nav .btn{white-space:nowrap}
.nav .btn{min-height:68px;font-size:1.5rem}
.top .izq{display:flex;gap:8px;pointer-events:none}.top .izq .tema{pointer-events:auto}

/* ===== Jugamos ===== */
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.vals .btn{min-height:68px;padding:10px 6px;font-size:clamp(1.05rem,4vw,1.5rem)}
.veredicto{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 20px;border-radius:16px;font:500 clamp(1.2rem,3vw,1.8rem)/1.3 var(--fd);text-align:center}
.veredicto b{font-weight:700}.veredicto.si{background:var(--okbg);color:var(--ok)}.veredicto.no{background:var(--nobg);color:var(--no)}
.opcs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:720px}
.opc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:3px solid var(--bd);background:var(--card);font:700 clamp(1.2rem,4.5vw,2rem) var(--fd);overflow-wrap:anywhere}
.opc i{font-style:normal;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--mu);font-size:1.4rem}
.opc.on{border-color:var(--ok);background:var(--okbg);color:var(--ok)}

/* Lexi · mascota por capas (la imagen original, sin redibujar) */
.lexi-mascota{position:relative;width:100%;max-width:520px;aspect-ratio:759/567;--lexi-coral:#FF6D60;--lexi-sombra:rgba(110,80,140,.16)}
.lexi-mascota>*,.lexi-mascota .flota>*{position:absolute}
.lexi-mascota img{left:0;top:0;width:100%;height:100%;display:block}
.lexi-mascota .sombra{background:var(--lexi-sombra);border-radius:50%;animation:lexi-sombra 4s ease-in-out infinite}
.lexi-mascota .flota{inset:0;animation:lexi-flota 4s ease-in-out infinite}
.lexi-mascota .brazo{transform-origin:17.5% 52.2%;animation:lexi-saluda 3.2s ease-in-out infinite}
.lexi-mascota .lid{background:var(--lexi-coral);border-radius:50%;transform:scaleY(0);transform-origin:50% 0;animation:lexi-parpadea 5s infinite}
@keyframes lexi-flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2%)}}
@keyframes lexi-sombra{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.94)}}
@keyframes lexi-saluda{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
@keyframes lexi-parpadea{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.lexi-mascota *{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>/* ---- js/00-util.js ---- */
'use strict';
/* ===== Utilidades comunes ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date().toISOString().slice(0, 10);
/* Almacén propio: todas las claves con prefijo «lexi.» (se comparte dominio con otras apps) */
const LS = {
  get(k, d) { try { const v = localStorage.getItem('lexi.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('lexi.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const nid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---- js/05-palabras.js ---- */
'use strict';
/* ===== Fichas de palabras: cada archivo de src/js/palabras/ llama a PALABRA({...}) ===== */
const PALABRAS = [];
const PALABRA = p => { PALABRAS.push(p); };
const palabraPorId = id => PALABRAS.find(p => p.id === id);

/* ---- js/10-tema.js ---- */
/* Tema claro/oscuro (clave lexi.th) */
const TEMA = {
  aplicar(t) { document.documentElement.dataset.theme = t; const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'dark' ? '#231413' : '#FFF1EC'; },
  inicial() { const g = LS.get('th', null); return g || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); },
  alternar() { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; LS.set('th', t); this.aplicar(t); }
};

/* ---- js/12-iconos.js ---- */
/* Iconos de línea (mismo estilo que Calculi, Lectori y Barri) */
const ICP = {
  lock: '<rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M4 20h16"/>',
  upload: '<path d="M12 16V5M7 10l5-5 5 5M4 20h16"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
  grad: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
  key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
  chev: '<path d="M9 5l7 7-7 7"/>',
  backspace: '<path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-5 6M12 9l5 6"/>'
};
const ico = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICP[n] || ''}</svg>`;
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ---- js/15-escala.js ---- */
/* Escala de 4 pasos de cada palabra: el bocadillo de Lexi crece y se llena (elegido por Iván, 14-11-2026).
   1 Nueva · 2 La conocemos · 3 La entendemos · 4 La usamos */
const PASOS = ['Nueva', 'La conocemos', 'La entendemos', 'La usamos'];
const BOCADILLO = 'M-16 88 H16 Q28 88 28 100 V114 Q28 126 16 126 H-12 L-22 138 L-20 126 Q-28 126 -28 114 V100 Q-28 88 -16 88 Z';
function escalaSVG(paso) {
  const p = Math.max(1, Math.min(4, paso | 0)), k = [.62, .76, .9, 1][p - 1];
  const raya = (y, w) => `<rect x="-16" y="${y}" width="${w}" height="5" rx="2.5" fill="var(--lx-blanco)"/>`;
  const fondo = [`fill="none" stroke="var(--lx-coral)" stroke-width="3" stroke-dasharray="6 5"`, `fill="var(--lx-pale)"`, `fill="var(--lx-rosa)"`, `fill="var(--lx-coral)"`][p - 1];
  const dentro = [``, `<circle cx="0" cy="107" r="4" fill="var(--lx-blanco)"/>`, raya(98, 32) + raya(110, 20),
    raya(97, 32) + raya(107, 32) + raya(117, 18) + `<path d="M34 84 L40 76 M38 92 L46 90 M30 78 L30 70" stroke="var(--lx-coral)" stroke-width="2.5" stroke-linecap="round" fill="none"/>`][p - 1];
  return `<svg class="escala" viewBox="-34 62 84 84" role="img" aria-label="Paso ${p} de 4: ${PASOS[p - 1]}">`
    + `<g transform="translate(0,138) scale(${k}) translate(0,-138)"><path d="${BOCADILLO}" ${fondo}/>${dentro}</g></svg>`;
}
function escalaFila() {
  return '<div class="escala-fila">' + PASOS.map((n, i) => `<figure>${escalaSVG(i + 1)}<figcaption>${n}</figcaption></figure>`).join('') + '</div>';
}

/* ---- js/20-datos.js ---- */
/* ===== Datos guardados: una sola clave, «lexi.v1» (prefijo propio: se comparte dominio con otras apps) =====
   Perfil Docente = una CLASE ({t:'doc'}); perfil Familias = un NIÑO ({t:'fam', av}). El progreso va por perfil, no por alumno:
   perfil.pal = { idPalabra: { e: paso de la escala 1..4 (1 Nueva, 2 La conocemos, 3 La entendemos, 4 La usamos), pres: fecha en que se presentó } }.
   v1 → v2: se añade «pal» a cada perfil (vacío).
   v2 → v3: cada palabra puede llevar «val» = valoraciones del docente [{d: fecha, t: tarea, v: 'todos'|'mitad'|'pocos'}] (las últimas 30). */
const VERSION_DATOS = 3, MAX_VAL = 30,
  TAREAS_ID = ['sentido', 'ejemplo', 'elige', 'acaba', 'habla'], VALORES = ['todos', 'mitad', 'pocos'], MAX_PERFILES = 40;
/* Mismos 30 animalitos y mismo orden que Calculi y Lectori (un niño conserva su animal en todas las apps) */
const AVATARES = [['🦊','#FED7AA'],['🐢','#BBF7D0'],['🐼','#E2E8F0'],['🦁','#FDE68A'],['🐸','#D9F99D'],['🐙','#F5D0FE'],['🐳','#BAE6FD'],['🦉','#E7D3B5'],
  ['🐝','#FEF08A'],['🐞','#FECACA'],['🦄','#FBCFE8'],['🐨','#CBD5E1'],['🐶','#FDE2C4'],['🐱','#FFE4B5'],['🐰','#FCE7F3'],['🐻','#E8CBA8'],
  ['🐯','#FED7AA'],['🐷','#FBCFE8'],['🐮','#E5E7EB'],['🐵','#E7D3B5'],['🐧','#C7D2FE'],['🐤','#FEF3C7'],['🦋','#BFDBFE'],['🐬','#A5F3FC'],
  ['🦒','#FDE68A'],['🦓','#E5E7EB'],['🐘','#CBD5E1'],['🦔','#E7D3B5'],['🐿️','#FED7AA'],['🦜','#BBF7D0']];

const ss = (s, n) => String(s ?? '').replace(/[<>&"'`]/g, '').trim().slice(0, n);
const esFecha = d => /^\d{4}-\d\d-\d\d$/.test(d || '');
function estadoVacio() { return { v: VERSION_DATOS, modo: '', act: '', perfiles: [], ajustes: { pin: '' } }; }
/* Modo Docente: todo abierto y NO se guarda progreso (los ajustes sí, con guardarAjustes) */
let MODO_DOCENTE = false;
let EST = estadoVacio();

/** Valoraciones del docente: solo tarea y valor conocidos y fecha válida; se quedan las últimas MAX_VAL. */
function limpiarVal(a) {
  return (Array.isArray(a) ? a : []).filter(x => x && typeof x === 'object' && esFecha(x.d) && TAREAS_ID.includes(x.t) && VALORES.includes(x.v))
    .map(x => ({ d: x.d, t: x.t, v: x.v })).slice(-MAX_VAL);
}
/** Progreso por palabra: solo ids con forma válida, paso entre 1 y 4 y fecha válida. */
function limpiarPal(o) {
  const r = {}; if (!o || typeof o !== 'object') return r;
  for (const [k, v] of Object.entries(o)) {
    if (!/^[a-z0-9-]{1,30}$/.test(k) || !v || typeof v !== 'object') continue;
    r[k] = { e: Math.max(1, Math.min(4, v.e | 0)), pres: esFecha(v.pres) ? v.pres : '', val: limpiarVal(v.val) };
    if (Object.keys(r).length >= 1000) break;
  }
  return r;
}
function limpiarPerfil(p) {
  if (!p || typeof p !== 'object' || !['doc', 'fam'].includes(p.t)) return null;
  return { id: /^[a-z0-9]{6,20}$/.test(p.id || '') ? p.id : nid(), t: p.t,
    n: ss(p.n, 20) || (p.t === 'doc' ? 'Clase' : 'Niño'),
    av: p.t === 'fam' ? Math.max(0, Math.min(AVATARES.length - 1, p.av | 0)) : 0,
    c: esFecha(p.c) ? p.c : hoy(), pal: limpiarPal(p.pal) };
}
/** Sanea cualquier cosa leída del disco (o importada) y la deja en la versión actual. */
function limpiar(o) {
  o = o && typeof o === 'object' ? o : {};
  /* Migraciones: v1 → v2 añade «pal» y v2 → v3 añade «val» (lo hace limpiarPal, que rellena lo que falta). Un «if (v < N) {…}» más por cada cambio de estructura. Nunca se pierde el progreso. */
  const vistos = new Set(), perfiles = [];
  for (const p of Array.isArray(o.perfiles) ? o.perfiles : []) {
    const q = limpiarPerfil(p); if (!q || vistos.has(q.id) || perfiles.length >= MAX_PERFILES) continue;
    vistos.add(q.id); perfiles.push(q);
  }
  const act = perfiles.find(p => p.id === o.act);
  const aj = o.ajustes && typeof o.ajustes === 'object' ? o.ajustes : {};
  return { v: VERSION_DATOS, modo: act ? act.t : (['doc', 'fam'].includes(o.modo) ? o.modo : ''), act: act ? act.id : '', perfiles, ajustes: { pin: /^\d{4}$/.test(aj.pin || '') ? aj.pin : '' } };
}
/** Lee lexi.v1. Si está roto, guarda una copia en lexi.bk antes de empezar de cero; si es de una versión más nueva, no la pisa. */
function cargar() {
  let raw = null; try { raw = localStorage.getItem('lexi.v1'); } catch (e) {}
  EST = estadoVacio(); if (raw == null) return EST;
  let o; try { o = JSON.parse(raw); } catch (e) { try { localStorage.setItem('lexi.bk', raw); } catch (e2) {} return EST; }
  EST = limpiar(o); if ((o && o.v | 0) > VERSION_DATOS) EST.bloq = true;
  return EST;
}
function guardar() { if (EST.bloq || MODO_DOCENTE) return false; return LS.set('v1', { v: EST.v, modo: EST.modo, act: EST.act, perfiles: EST.perfiles, ajustes: EST.ajustes }); }
/** Los ajustes (PIN) se guardan también en Modo Docente; el progreso no. */
function guardarAjustes() { const m = MODO_DOCENTE; MODO_DOCENTE = false; const r = guardar(); MODO_DOCENTE = m; return r; }

const perfilesDe = t => EST.perfiles.filter(p => p.t === t);
const perfilAct = () => EST.perfiles.find(p => p.id === EST.act) || null;
/** Primer animal que no usa ningún niño (si están todos, se repite por orden). */
function avLibre() { const u = new Set(perfilesDe('fam').map(p => p.av)); for (let i = 0; i < AVATARES.length; i++) if (!u.has(i)) return i; return perfilesDe('fam').length % AVATARES.length; }
/** Texto de error para un nombre de perfil, o '' si vale. idExcluir: el propio perfil al renombrar. */
function errorNombre(t, nombre, idExcluir = '') {
  const n = ss(nombre, 20);
  if (!n) return 'Escribe un nombre';
  if (perfilesDe(t).some(p => p.id !== idExcluir && p.n.toLowerCase() === n.toLowerCase())) return 'Ese nombre ya existe';
  return '';
}
/** Crea un perfil y lo deja activo. Devuelve null si falta el nombre, hay demasiados o el nombre ya existe en ese tipo. */
function crearPerfil(t, nombre, av) {
  const n = ss(nombre, 20);
  if (EST.bloq || EST.perfiles.length >= MAX_PERFILES || errorNombre(t, n)) return null;
  const p = limpiarPerfil({ t, n, av, c: hoy() }); EST.perfiles.push(p); EST.act = p.id; EST.modo = t; guardar(); return p;
}
function entrarPerfil(id) { const p = EST.perfiles.find(x => x.id === id); if (!p) return null; EST.act = p.id; EST.modo = p.t; guardar(); return p; }

function renombrarPerfil(id, nombre) { const p = EST.perfiles.find(x => x.id === id); if (!p || EST.bloq || errorNombre(p.t, nombre, id)) return false; p.n = ss(nombre, 20); return guardar() || MODO_DOCENTE; }
function cambiarAnimal(id, av) { const p = EST.perfiles.find(x => x.id === id); if (!p || p.t !== 'fam' || EST.bloq) return false; p.av = Math.max(0, Math.min(AVATARES.length - 1, av | 0)); guardar(); return true; }
/** Borra el perfil (su progreso va dentro, así que se borra con él). */
function borrarPerfil(id) {
  if (EST.bloq || !EST.perfiles.some(x => x.id === id)) return false;
  EST.perfiles = EST.perfiles.filter(x => x.id !== id);
  if (EST.act === id) { EST.act = ''; EST.modo = ''; }
  guardar(); return true;
}
/* ===== Progreso de palabras ===== */
const estadoPal = (p, id) => (p && p.pal && p.pal[id]) || { e: 1, pres: '', val: [] };
/** La clase (o el niño) acaba de ver la presentación completa: la palabra pasa a «La conocemos». Nunca baja ni se salta pasos.
    En Modo Docente no guarda nada. Devuelve true si guardó. */
function presentarPalabra(id) {
  const p = perfilAct();
  if (MODO_DOCENTE || !p || EST.bloq || !/^[a-z0-9-]{1,30}$/.test(id || '')) return false;
  const a = estadoPal(p, id);
  p.pal[id] = { e: Math.max(2, a.e), pres: a.pres || hoy(), val: a.val || [] };
  return guardar();
}
/** El docente valora una tarea hecha con la clase («todos», «mitad» o «pocos»). No cambia el paso de la escala (eso es la Fase 3).
    En Modo Docente no guarda. Devuelve true si guardó. */
function valorarTarea(id, tarea, valor) {
  const p = perfilAct();
  if (MODO_DOCENTE || !p || EST.bloq || !/^[a-z0-9-]{1,30}$/.test(id || '') || !TAREAS_ID.includes(tarea) || !VALORES.includes(valor)) return false;
  const a = estadoPal(p, id);
  p.pal[id] = { e: a.e, pres: a.pres, val: [...(a.val || []), { d: hoy(), t: tarea, v: valor }].slice(-MAX_VAL) };
  return guardar();
}
const PIN_OK = p => /^\d{4}$/.test(p || '');
function fijarPin(pin) { if (!PIN_OK(pin) || EST.bloq) return false; EST.ajustes.pin = pin; guardarAjustes(); return true; }

/* ===== Copia de seguridad ===== */
function exportarTexto() { return JSON.stringify({ app: 'lexi', v: EST.v, exportado: hoy(), modo: EST.modo, act: EST.act, perfiles: EST.perfiles, ajustes: EST.ajustes }, null, 1); }
/** Comprueba un texto de copia. Devuelve {datos} o {error}. No toca nada. */
function leerCopia(texto) {
  let o; try { o = JSON.parse(texto); } catch (e) { return { error: 'Ese archivo no es una copia de Lexi' }; }
  if (!o || typeof o !== 'object' || o.app !== 'lexi' || !Array.isArray(o.perfiles)) return { error: 'Ese archivo no es una copia de Lexi' };
  if ((o.v | 0) > VERSION_DATOS) return { error: 'Esta copia es de una versión más nueva de Lexi' };
  return { datos: limpiar(o) };
}
/** Sustituye los datos por los de la copia. Antes guarda lo que hubiera en «lexi.bk» para no perder nada. */
function aplicarCopia(datos) {
  try { const ant = localStorage.getItem('lexi.v1'); if (ant != null) localStorage.setItem('lexi.bk', ant); } catch (e) {}
  EST = datos; const m = MODO_DOCENTE; MODO_DOCENTE = false; const r = guardar(); MODO_DOCENTE = m; return r;
}

/* ---- js/40-inicio.js ---- */

SC.inicio = function () {

let NUEVO_NOM = '';
function pintar() {
  $('#app').innerHTML = barra() + (SC[PANT] || SC.inicio)();
}
function go(p) { PANT = p; ERR = ''; pintar(); window.scrollTo(0, 0); }
function atras() {
  if (PANT === 'tz' && (TZ.sub || TZ.borrar)) { TZ.sub = ''; TZ.borrar = ''; TZ.imp = null; ERR = ''; return pintar(); }
  if (PANT === 'pres' || PANT === 'juego') return go('semana');

function elegirModo(m) { MODO = m; NUEVO_NOM = ''; NUEVO_AV = null; go('quien'); }
function animalNuevo(i) { NUEVO_AV = i; pintar(); const f = $('#nom'); if (f) f.focus(); }
function entrar(id) { if (entrarPerfil(id)) go('casa'); }
function crearDesdeForm(ev) {
  ev.preventDefault();
  const n = ss(NUEVO_NOM, 20), e = errorNombre(MODO, n);
  if (e) ERR = e;
  else if (EST.bloq) ERR = 'Estos datos son de una versión más nueva de Lexi';
  else if (!crearPerfil(MODO, n, NUEVO_AV ?? avLibre())) ERR = 'No se ha podido crear';
  else { NUEVO_NOM = ''; NUEVO_AV = null; return go('casa'); }
  pintar(); const f = $('#nom'); if (f) f.focus();
}

/* ---- js/45-semana.js ---- */
/* ===== Palabras de la semana y presentación de una palabra nueva (la guía el docente; la app solo muestra texto) =====
   Orden de docs/pedagogia.md: escena · la decimos · palmadas · explicación · gesto · 3 contextos · fin. */
const SEMANA_ACT = 1;
let PRES = { id: '', i: 0 };
const PRES_PASOS = 9;
const palabrasSemana = n => PALABRAS.filter(p => p.semana === n);
const imgPal = p => 'img/palabras/' + p.escena.img;

SC.semana = function () {
  const pr = MODO_DOCENTE ? null : perfilAct(), lista = palabrasSemana(SEMANA_ACT);
  setTimeout(() => lista.forEach(p => { const im = new Image(); im.src = imgPal(p); }), 0); /* el service worker las guarda para usarlas sin conexión */
  return `<main class="pantalla infantil ancha"><h1 class="h-pant">Semana ${SEMANA_ACT}</h1>
  ${lista.some(x => MODO_DOCENTE || estadoPal(pr, x.id).e >= 2) ? '<button class="btn grande" onclick="empezarJuego()">Jugamos</button>' : '<p class="mu">Presenta alguna palabra para poder jugar con ella.</p>'}
  <p class="mu">Toca una palabra para presentarla a la clase.</p>
  <div class="palabras">${lista.map(p => `<button class="pal" onclick="abrirPalabra('${p.id}')"><img src="${esc(imgPal(p))}" alt="" loading="lazy">
  <span class="pal-pie"><span class="pal-n">${esc(p.palabra)}</span>${escalaSVG(estadoPal(pr, p.id).e)}</span></button>`).join('')}</div></main>`;
};

SC.pres = function () {
  const p = palabraPorId(PRES.id); if (!p) return SC.semana();
  const i = PRES.i, ult = i === PRES_PASOS - 1;
  let rot, cuerpo;
  if (i === 0) { rot = 'Escena'; cuerpo = `<div class="escena"><img class="esc-img" src="${esc(imgPal(p))}" alt=""><p class="gr">${esc(p.escena.texto)}</p></div>`; }
  else if (i === 1) { rot = 'La decimos todos'; cuerpo = `<p class="palabra-g">${esc(p.palabra)}</p><p class="mu gr-p">Todos juntos</p>`; }
  else if (i === 2) {
    rot = 'Con palmadas';
    cuerpo = `<p class="silabas">${p.silabas.map(s => `<span class="sil">${esc(s)}</span>`).join('<i class="pt" aria-hidden="true">·</i>')}</p><p class="mu gr-p">${p.silabas.length} ${p.silabas.length === 1 ? 'palmada' : 'palmadas'}</p>`;
  }
  else if (i === 3) { rot = 'Qué quiere decir'; cuerpo = `<p class="pal-ch">${esc(p.palabra)}</p><p class="gr">${esc(p.def)}</p>`; }
  else if (i === 4) { rot = 'Gesto'; cuerpo = `<p class="pal-ch">${esc(p.palabra)}</p><p class="gr">${esc(p.gesto)}</p>`; }
  else if (i <= 7) { rot = `Más ejemplos · ${i - 4} de 3`; cuerpo = `<p class="pal-ch">${esc(p.palabra)}</p><p class="gr">${esc(p.contextos[i - 5])}</p>`; }
  else { rot = 'Ya la conocemos'; cuerpo = `<p class="palabra-g">${esc(p.palabra)}</p><div class="fin-esc">${escalaSVG(2)}<span>${PASOS[1]}</span></div>`; }
  const pts = Array.from({ length: PRES_PASOS }, (_, k) => `<i class="${k === i ? 'on' : k < i ? 'hecho' : ''}"></i>`).join('');
  return `<main class="pantalla infantil ancha pres"><p class="rotulo">${rot}</p>
  <div class="cuerpo">${cuerpo}</div><div class="pts" aria-hidden="true">${pts}</div>
  <div class="nav">${i > 0 ? '<button class="btn sec" onclick="presMover(-1)">← Antes</button>' : '<span></span>'}
  ${ult ? '<button class="btn" onclick="atras()">Terminar</button>' : '<button class="btn" onclick="presMover(1)">Siguiente →</button>'}</div></main>`;
};
function abrirPalabra(id) { PRES = { id, i: 0 }; go('pres'); }
function presMover(d) {
  PRES.i = Math.max(0, Math.min(PRES_PASOS - 1, PRES.i + d));
  if (PRES.i === PRES_PASOS - 1) presentarPalabra(PRES.id); /* al llegar al final se da por presentada (en Modo Docente no se guarda) */
  pintar(); window.scrollTo(0, 0);
}

/* ---- js/48-tareas.js ---- */
/* ===== «Jugamos»: 2 tareas con palabras de la semana (la guía el docente; la clase responde con pulgares, dedos o hablando) =====
   Tareas: sentido, ejemplo, elige, acaba, habla (ver docs/pedagogia.md, apartado 3). Tras cada una, el docente valora: casi todos · la mitad · pocos.
   La valoración es opcional y por ahora solo se apunta (valorarTarea); la subida de pasos de la escala llega en la Fase 3. */
let JUEGO = null, JUEGO_N = 0;
const NJUEGO = 2;
const TAREA_ROT = { sentido: '¿Tiene sentido?', ejemplo: '¿Es o no es?', elige: '¿Qué palabra va?', acaba: 'Acaba la frase', habla: 'Cuéntaselo a tu compañero' };
const CON_RESPUESTA = { sentido: true, ejemplo: true, elige: true, acaba: false, habla: false };
const VAL_TXT = { todos: 'Casi todos', mitad: 'La mitad', pocos: 'Pocos' };

/** Palabras con las que se puede jugar: las ya presentadas (en Modo Docente, todas las de la semana). */
function palabrasJugables(pr) { return palabrasSemana(SEMANA_ACT).filter(p => MODO_DOCENTE || estadoPal(pr, p.id).e >= 2); }
/** Monta la cola: las palabras con menos valoraciones primero; cada una con una tarea distinta de su última y de la otra de la sesión. */
function montarJuego(pr, n = NJUEGO, vuelta = JUEGO_N) {
  const lista = palabrasJugables(pr).map((p, i) => ({ p, i, v: (estadoPal(pr, p.id).val || []).length }))
    .sort((a, b) => a.v - b.v || a.i - b.i).slice(0, n), usadas = [], cola = [];
  lista.forEach(({ p, v }, k) => {
    const val = estadoPal(pr, p.id).val || [], ult = val.length ? val[val.length - 1].t : '', off = v + k + vuelta;
    const orden = TAREAS_ID.map((_, j) => TAREAS_ID[(off + j) % TAREAS_ID.length]);
    const t = orden.find(x => x !== ult && !usadas.includes(x)) || orden.find(x => x !== ult) || orden[0];
    usadas.push(t); cola.push({ id: p.id, t, k: v + vuelta, rev: false });
  });
  return cola;
}
function empezarJuego() {
  const cola = montarJuego(MODO_DOCENTE ? null : perfilAct()); JUEGO_N++;
  if (!cola.length) return;
  JUEGO = { cola, i: 0 }; go('juego');
}
function juegoRevelar() { JUEGO.cola[JUEGO.i].rev = true; pintar(); }
function juegoValorar(v) { const q = JUEGO.cola[JUEGO.i]; if (v) valorarTarea(q.id, q.t, v); JUEGO.i++; pintar(); window.scrollTo(0, 0); }

/** Contenido de una tarea: devuelve {cuerpo, res} (res = lo que se enseña al tocar «Ver la respuesta»). */
function tareaHTML(q, p) {
  const pal = `<p class="pal-ch">${esc(p.palabra)}</p>`;
  if (q.t === 'sentido') {
    const s = p.sentido[q.k % p.sentido.length];
    return { cuerpo: `${pal}<p class="gr">${esc(s.t)}</p><p class="mu gr-p">Pulgar arriba o abajo</p>`,
      res: `<div class="veredicto ${s.ok ? 'si' : 'no'}"><b>${s.ok ? '👍 Sí tiene sentido' : '👎 No tiene sentido'}</b><span>${esc(s.por)}</span></div>` };
  }
  if (q.t === 'ejemplo') {

/* ===== Zona del tutor (sobria, letra Inter), protegida con PIN de 4 cifras ===== */
const TZ = { fase: '', pin: '', pin1: '', hasta: 0, destino: 'tz', sub: '', borrar: '', imp: null, origen: 'pin' };

function abrirTutor(destino = 'tz') {
  TZ.destino = destino; TZ.pin = ''; TZ.sub = ''; TZ.borrar = ''; TZ.imp = null;
  if (Date.now() < TZ.hasta && EST.ajustes.pin) return irDestino();
  TZ.fase = EST.ajustes.pin ? 'pedir' : 'crear'; go('pin');
}
function irDestino() { if (TZ.destino === 'docente') entrarDocente(); else go('tz'); }
function entrarDocente() { MODO_DOCENTE = true; go('casa'); }

const botonArchivo = (txt, icono = 'upload') => `<label class="fila-t arch">${ico(icono, 22)}<span class="tx2"><b>${txt}</b></span><input type="file" id="fi" accept="application/json,.json" onchange="leerArchivo(this)"></label>`;
SC.pin = function () {
  const T = { crear: ['Crea un PIN de 4 cifras', 'Se pedirá para entrar en la zona del tutor y en el Modo Docente. Tras escribirlo, no se vuelve a pedir durante 5 minutos.'],
    repetir: ['Repite el PIN', 'Escríbelo otra vez para confirmarlo.'], nuevo: ['Nuevo PIN', 'Escribe el PIN nuevo de 4 cifras.'], pedir: ['Zona del tutor', 'Escribe el PIN de 4 cifras.'] }[TZ.fase];
  const k = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="pinTecla('${n}')">${n}</button>`).join('');
  return `<main class="pantalla tutor"><div class="tarjeta pinw"><span class="lk">${ico('lock', 26)}</span><h2>${T[0]}</h2><p class="mu">${T[1]}</p>
  <div class="pd" id="pd" role="img" aria-label="${TZ.pin.length} de 4 cifras">${[0, 1, 2, 3].map(i => `<i class="${i < TZ.pin.length ? 'f' : ''}"></i>`).join('')}</div>
  <div class="pk">${k}<span></span><button onclick="pinTecla('0')">0</button><button onclick="pinTecla('b')" aria-label="Borrar">${ico('backspace', 22)}</button></div>
  ${TZ.fase === 'pedir' ? `<p class="mu pq">¿Lo has olvidado? No hace falta borrar nada: restaura una copia de seguridad, que trae su PIN.</p>${botonArchivo('Restaurar copia')}` : ''}</div></main>`;
};
function pinTecla(t) {
  if (t === 'b') TZ.pin = TZ.pin.slice(0, -1); else if (TZ.pin.length < 4) TZ.pin += t;
  pintar(); if (TZ.pin.length < 4) return;
  setTimeout(() => {
    if (TZ.fase === 'crear' || TZ.fase === 'nuevo') { TZ.pin1 = TZ.pin; TZ.pin = ''; TZ.fase = 'repetir'; pintar(); }
    else if (TZ.fase === 'repetir') {
      if (TZ.pin === TZ.pin1) { fijarPin(TZ.pin); TZ.hasta = Date.now() + 3e5; toast('PIN guardado'); irDestino(); }
      else { TZ.pin = ''; TZ.fase = EST.ajustes.pin ? 'nuevo' : 'crear'; mal(); }
    } else { if (TZ.pin === EST.ajustes.pin) { TZ.hasta = Date.now() + 3e5; irDestino(); } else { TZ.pin = ''; mal(); } }
  }, 180);
  function mal() { pintar(); const d = $('#pd'); if (d) d.classList.add('mal'); }

const fila = (icono, t, sub, fn) => `<button class="fila-t" onclick="${fn}">${ico(icono, 22)}<span class="tx2"><b>${t}</b>${sub ? `<small>${sub}</small>` : ''}</span>${ico('chev', 18)}</button>`;

function exportar() {
  const b = new Blob([exportarTexto()], { type: 'application/json' }), u = URL.createObjectURL(b), l = document.createElement('a');
  l.href = u; l.download = `lexi-copia-${hoy()}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast('Copia descargada');

  const f = inp.files[0]; if (!f) return;
